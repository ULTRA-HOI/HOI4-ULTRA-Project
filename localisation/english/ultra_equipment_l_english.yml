 #### Landing Crafts ####

 landing_craft_equipment: "Landing Craft"
 landing_craft_equipment_desc: "Small amphibious crafts for shore landing operations."
 landing_craft_equipment_1: "Civilian Barge"
 landing_craft_equipment_1_desc: "Converted Civilian River Barge with no additional protection."
 landing_craft_equipment_2: "Landing Craft"
 landing_craft_equipment_2_desc: "Purpose-built amphibious vessel."
 landing_craft_equipment_3: "Improved Landing Craft"
 landing_craft_equipment_3_desc: "Improved version of the original Landing Craft."
 GER_landing_craft_equipment_2: "Pionierlandungsboot 39"
 GER_landing_craft_equipment_2_short: "Pilabo 39"
 GER_landing_craft_equipment_2_desc: "The Pionierlandungsboot 39 was a landing craft designed and build for the Wehrmacht from 1940 onwards. It was planned to be first used in Operation Seelöwe in conjunction with the bigger Marinefährprahm. After the cancellation of the Operation it saw use on all fronts transporting Material over rivers and seas."
 GER_landing_craft_equipment_3: "Pionierlandungsboot 41"
 GER_landing_craft_equipment_3_short: "Pilabo 41"
 GER_landing_craft_equipment_3_desc: "The Pionierlandungsboot 41 was an improvement over the earlier Pilabo 39 and 40. It featured a better ramp-bow, allowing for quicker unloading."
 ITA_landing_craft_equipment_2: "Motolance ML"
 ITA_landing_craft_equipment_2_desc: "An italian Landing Craft designed for the invasion of Malta. 100 units were ordered but only 9 were built. The fate of the crafts is unkown but its believed that none survived the war."
 JAP_landing_craft_equipment_2: "Daihatsu-Class Landing Craft"
 JAP_landing_craft_equipment_2_short: "Daihatsu-Class"
 JAP_landing_craft_equipment_2_desc: "The Daihatsu-class was an outstanding landing craft developed before the war and saw extensive use by japanese amphibious personnel. It was so successful in its purpose that it was studied by the USMC and influenced the development of the LCP(R) and LCVP heavily."
 JAP_landing_craft_equipment_3: "Toku Daihatsu-Class Landing Craft"
 JAP_landing_craft_equipment_3_short: "Toku Daihatsu-Class"
 JAP_landing_craft_equipment_3_desc: "The Toku Daihatsu-class an enlarged version of the earlier Daihatsu-class allowing for a larger load and heavier weapons to be carried."
 ENG_landing_craft_equipment_2: "Assault Landing Craft"
 ENG_landing_craft_equipment_2_short: "ALC"
 ENG_landing_craft_equipment_2_desc: "The Assault Landing Craft or also known as the Landing Craft Assault after the joint US-UK nomenclature system was the primary Landing Craft used by the Royal Navy and Commonwealth Navies throughout WW2. It was a very successful design that remained mostly unchanged throughout the war."
 ENG_landing_craft_equipment_3: "Landing Craft Assault"
 ENG_landing_craft_equipment_3_short: "LCA"
 ENG_landing_craft_equipment_3_desc: "The Landing Craft Assault is the late war variant that had an improved bow and better engines over the early war ALC."
 CAN_landing_craft_equipment_2: "Assault Landing Craft"
 CAN_landing_craft_equipment_2_short: "ALC"
 CAN_landing_craft_equipment_2_desc: "The Assault Landing Craft or also known as the Landing Craft Assault after the joint US-UK nomenclature system was the primary Landing Craft used by the Royal Navy and Commonwealth Navies throughout WW2. It was a very successful design that remained mostly unchanged throughout the war."
 CAN_landing_craft_equipment_3: "Landing Craft Assault"
 CAN_landing_craft_equipment_3_short: "LCA"
 CAN_landing_craft_equipment_3_desc: "The Landing Craft Assault is the late war variant that had an improved bow and better engines over the early war ALC."
 RAJ_landing_craft_equipment_2: "Assault Landing Craft"
 RAJ_landing_craft_equipment_2_short: "ALC"
 RAJ_landing_craft_equipment_2_desc: "The Assault Landing Craft or also known as the Landing Craft Assault after the joint US-UK nomenclature system was the primary Landing Craft used by the Royal Navy and Commonwealth Navies throughout WW2. It was a very successful design that remained mostly unchanged throughout the war."
 RAJ_landing_craft_equipment_3: "Landing Craft Assault"
 RAJ_landing_craft_equipment_3_short: "LCA"
 RAJ_landing_craft_equipment_3_desc: "The Landing Craft Assault is the late war variant that had an improved bow and better engines over the early war ALC."
 USA_landing_craft_equipment_2: "Landing Craft Personnel(Ramp)"
 USA_landing_craft_equipment_2_short: "LCP(R)"
 USA_landing_craft_equipment_2_desc: "The Landing Craft, Personnel (Ramp) was the first Landing Craft of the USMC that featured a ramp-bow. Heavily inspired by the japanese Daihatsu-class. It was also nicknamed the Higgins Boat after its designer Andrew Higgins."
 USA_landing_craft_equipment_3: "Landing Craft Vehicle Personnel"
 USA_landing_craft_equipment_3_short: "LCVP"
 USA_landing_craft_equipment_3_desc: "The Landing Craft, Vehicle, Personnel was the improved version of the earlier LCP(R). By Normandy all LCP(R) in service were replaced by the LCVP."