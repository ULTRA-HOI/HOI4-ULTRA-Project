 # Operation Valkyrie Events
 valkyrie.1.title:0 "Resistance Emerges"
 valkyrie.1.desc:0 "Reports indicate that resistance against the regime is forming in various circles within the Wehrmacht and civilian population."
 valkyrie.1.option.a:0 "Monitor the situation closely."

 valkyrie.2.title:0 "The September Plot of 1938"
 valkyrie.2.desc:0 "General Beck and other high-ranking officers were planning a coup and killing Hitler during the Sudetenland crisis, but the Munich Agreement prevented its execution."
 valkyrie.2.option.a:0 "Keep me informed."
 valkyrie.2.option.b:0 "Mention only important attempts."

 valkyrie.3.title:0 "Maurice Bavaud's Assassination Attempt"
 valkyrie.3.desc:0 "A Swiss theology student attempted to assassinate the Führer during a commemoration ceremony on November 9, 1938, but was unable to get close enough. He was arrested for fare evasion while trying to leave Germany via train to Paris. Then they found his plans and weapon."
 valkyrie.3.option.a:0 "Execute him in secret."

 valkyrie.4.title:0 "The Bürgerbräukeller Bombing"
 valkyrie.4.desc:0 "Communist clockmaker Georg Elser planted a bomb in the Bürgerbräukeller during the annual Beer Hall Putsch commemoration. The explosion occurred exactly at the right time, but the Führer had left earlier than planned. Elser was arrested when trying to cross the border to Switzerland."
 valkyrie.4.option.a:0 "Saved by sheer luck."

 valkyrie.5.title:0 "Erich Kordt's Attempt"
 valkyrie.5.desc:0 "German diplomat Erich Kordt planned to assassinate the Führer in the Reich Chancellery with a scuicide bomb but found the security too tight after Elsers attempt to carry out the plan."
 valkyrie.5.option.a:0 "The security is too tight."

 valkyrie.6.title:0 "Paris Victory Parade Attempt"
 valkyrie.6.desc:0 "Two German officers of the military resistance wanted to shoot Hitler during the Paris victory parade. But the Führer instead visited the city in secret and left, so the parade was cancelled."
 valkyrie.6.option.a:0 "He was already here?"

 valkyrie.7.title:0 "Cancelled Paris Visit"
 valkyrie.7.desc:0 "An assassination attempt was planned during the Führer's visit to Paris in May 1941, but the visit was cancelled at the last moment, likely because of the fighting in Yugoslavia and Greece."
 valkyrie.7.option.a:0 "The Balkan getting in the way."

 valkyrie.8.title:0 "Smolensk Airport Ambush"
 valkyrie.8.desc:0 "On March 13, 1943, military resistance members under Major Georg von Boeselager planned to ambush the Führer on his way from Smolensk airport to the local army headquarters. Unexpectedly, the SS provided a far heavier escort than anticipated."
 valkyrie.8.option.a:0 "There are too many guards."
 valkyrie.8.option.b:0 "Open fire!"

 valkyrie.9.title:0 "Smolensk Dinner Attempt"
 valkyrie.9.desc:0 "Later that same day, another attempt was planned by Henning von Tresckow, von Boeselager and others during dinner at the Smolensk army headquarters, but Himmler's absence complicated the plan. Without Himmler dying too, a civil war might have errupted. The assassination was aborted."
 valkyrie.9.option.a:0 "Without Himmler it's not worth it."
 valkyrie.9.option.b:0 "Shoot Hitler regardless."

 valkyrie.10.title:0 "The Frozen Bomb"
 valkyrie.10.desc:0 "Henning von Tresckow placed a bomb disguised as cognac bottles on the Führer's return flight from Smolensk, but the trigger mechanism was prown to freezing at high altitude."
 valkyrie.10.option.a:0 "The bomb trigger froze."
 valkyrie.10.option.b:0 "Report Soviet fighters in the air!"

 valkyrie.11.title:0 "Gersdorff's Suicide Mission"
 valkyrie.11.desc:0 "Rudolf von Gersdorff planned to detonate explosives during a military exhibition, but the Führer left the event earlier than expected."
 valkyrie.11.option.a:0 "Hitler already left."

 valkyrie.12.title:0 "The Destroyed Uniforms"
 valkyrie.12.desc:0 "Axel von dem Bussche planned a suicide bombing during a uniform demonstration, but the uniforms were destroyed in an allied air raid."
 valkyrie.12.option.a:0 "No presentation without uniforms."

 valkyrie.13.title:0 "Von Kleist's Attempt"
 valkyrie.13.desc:0 "Lieutenant von Kleist had prepared for a suicide bombing during a uniform presentation, but the Führer cancelled his appearance at the last moment. Another opportunity has slipped away."
 valkyrie.13.option.a:0 "He cancelled?!"

 valkyrie.14.title:0 "The Generals' Meeting"
 valkyrie.14.desc:0 "Captain von Breitenbruch planned to shoot the Führer during a military briefing, but security restrictions meant that only generals were allowed into the meeting room. The plan had to be abandoned."
 valkyrie.14.option.a:0 "No Aide-de-Camps allowed."

 valkyrie.15.title:0 "Stieff's Hesitation"
 valkyrie.15.desc:0 "Colonel Stieff had been given a bomb to use against the Führer during a military demonstration, but when the moment came, he found himself unable to carry out the act. The conspiracy continues to struggle with the human element."
 valkyrie.15.option.a:0 "Stieff just couldn't do it."

 valkyrie.16.title:0 "First Stauffenberg Attempt"
 valkyrie.16.desc:0 "Colonel von Stauffenberg has prepared for his first assassination attempt during a military briefing. However, the conspirators had hoped that both the Führer and Himmler would be present. Should they proceed with only one target?"
 valkyrie.16.option.a:0 "Himmler isn't there."
 valkyrie.16.option.b:0 "Hitler must die!"

 valkyrie.17.title:0 "Second Stauffenberg Attempt"
 valkyrie.17.desc:0 "Once more von Stauffenberg is in position for an assassination attempt, but Himmler is absent from the meeting again. The conspirators face the same dilemma as before. Time is running out for the resistance."
 valkyrie.17.option.a:0 "Himmler isn't there...again!"
 valkyrie.17.option.b:0 "Hitler must die!"

 valkyrie.18.title:0 "The Final Attempt"
 valkyrie.18.desc:0 "This is von Stauffenberg's final opportunity. The conspirators have grown desperate, and they can no longer afford to wait for the perfect moment, the last time they barely managed to conceal the aborted launch of Operation Valkyrie. The time has come to act, regardless of the consequences."
 valkyrie.18.option.a:0 "Damn Himmler, Hitler must die NOW!"

 valkyrie.100.title:0 "Operation Valkyrie"
 valkyrie.100.desc:0 "It is done. In whatever way it happened, the plotters around Henning von Tresckow and Claus von Stauffenberg believe the Führer is dead and have initiated Operation Valkyrie - the plan to seize control of the government, telecommunication channels, radio stations, Nazi party headquarters and SS barracks. Military commanders across the Reich await confirmation of the situation. The fate of Germany hangs in the balance."
 valkyrie.100.option.a:0 "The Führer survives!"
 valkyrie.100.option.b:0 "The Führer is dead! Göring takes over!"
 valkyrie.100.option.c:0 "Hitler is dead, Valkyrie succeeds!"

 valkyrie.101.title:0 "Who shall lead the Reich?"
 valkyrie.101.desc:0 "The Führer is dead, and the conspirators have taken control of the government. But who will lead the Reich now?\nGeneral Ludwig Beck has been secretly opposed to the Nazis for almost a decade, was one of the heads of the coup and is an excellent organiser with long leadership experience but is basically unknown to most.\nFeldmarschall Erwin Rommel is a supremely popular war hero, a capable officer and would help to rally especially the younger Germans to our cause, but had close ties to Hitler and has not been involved in Valkyrie in any way."
 valkyrie.101.option.a:0 "Ludwig Beck stays in charge." 
 valkyrie.101.option.b:0 "Erwin Rommel will ensure stability."

