 # Waffen-SS Recruitment Decisions

 # Wehrmacht Recruitment Decisions
 wm_recruitment_event.1.title:0 "Expand Großdeutschland Regiment"
 wm_recruitment_event.1.desc:0 "The former elite Watch Regiment 'Berlin', now named 'Großdeutschland', has served with distinction in multiple campaigns. To expand on its status as the most elite formation of the German Army distinct from the Waffen-SS we should expand it to a reinforced motorized infantry division, with priority on recruiting from the best soldiers available."
 wm_recruitment_event.1.a:0 "Expand the Großdeutschland Regiment to a Division."
 wm_recruitment_decision_1:0 "Expand Großdeutschland Regiment"
 GER_wm_recruitment_event.1.tt:0 "One elite §Ymotorized Infantry Division Großdeutschland §! will appear without equipment but full manpower strength."

 wm_recruitment_event.2.title:0 "Form Panzer-Division 'Hermann Göring'"
 wm_recruitment_event.2.desc:0 "Reichsmarschall and commander of the Luftwaffe Hermann Göring has long desired to have his own Luftwaffe Panzer Division. With the expansion of the Luftwaffe and the increasing mechanization of warfare, it is time to form this division from Luftwaffe personnel and equipment to counter the quickly growing influence of the Waffen-SS."
 wm_recruitment_event.2.a:0 "Form the Panzer-Division 'Hermann Göring'."
 wm_recruitment_decision_2:0 "Form Panzer-Division 'Hermann Göring'"
 GER_wm_recruitment_event.2.tt:0 "One §YPanzer-Division Hermann Göring §! will appear without equipment but full manpower strength."

 wm_recruitment_event.3.title:0 "Form Fallschirm-Panzergrenadier-Division 'Hermann Göring'"
 wm_recruitment_event.3.desc:0 "After the success of the Panzer-Division 'Hermann Göring' the Reichsmarschall demands a second division under his name be formed."
 wm_recruitment_event.3.a:0 "Form the Fallschirm-Panzergrenadier-Division 'Hermann Göring'."
 wm_recruitment_decision_3:0 "Form Fallschirm-Panzergrenadier-Division 'Hermann Göring'"
 GER_wm_recruitment_event.3.tt:0 "One §YFallschirm-Panzergrenadier-Division Hermann Göring §! will appear without equipment but full manpower strength."

 wm_recruitment_event.4.title:0 "Create the 'Feldherrnhalle Division'"
 wm_recruitment_event.4.desc:0 "The SA has been sidelined and reduced in importance since the Night of the Long Knives, but it still has a large number of members and veterans from the early days. To create a new division in the Wehrmacht opposed to the SS we should recruit from the SA and name it after the Feldherrnhalle in Munich, where the Beer Hall Putsch of 1923 took place."
 wm_recruitment_event.4.a:0 "Create the Feldherrnhalle Division."
 wm_recruitment_decision_4:0 "Create the Feldherrnhalle Division" 
 GER_wm_recruitment_event.4.tt:0 "One weak §YPanzergrenadier-Division Feldherrnhalle §! will appear without equipment but full manpower strength."

 wm_recruitment_event.5.title:0 "Create the Panzer-Division 'Feldherrnhalle 2'"
 wm_recruitment_event.5.desc:0 "The success of the Feldherrnhalle Division has convinced the leadership to create a second division recruiting from SA members and veterans."
 wm_recruitment_event.5.a:0 "Create the Panzer-Division 'Feldherrnhalle 2'."
 wm_recruitment_decision_5:0 "Create the Panzer-Division 'Feldherrnhalle 2'"
 GER_wm_recruitment_event.5.tt:0 "One §YPanzer-Division Feldherrnhalle 2 §! will appear without equipment but full manpower strength."

 wm_recruitment_event.6.title:0 "Form the Croatian Legion"
 wm_recruitment_event.6.desc:0 "The Independent State of Croatia is a German puppet state, and its leader Ante Pavelić has offered to send a legion of Croatian volunteers to fight alongside the Wehrmacht. This would not only bolster our non-SS-aligned forces in the Wehrmacht but also strengthen our ties with Croatia. We should accept this offer and form the three divisions of the Croatian Legion."
 wm_recruitment_event.6.a:0 "Form the Croatian Legion."
 wm_recruitment_decision_6:0 "Form the Croatian Legion"
 GER_wm_recruitment_event.6.tt:0 "Three small §YInfantry Divisions of the Croatian Legion §! will appear without equipment but full manpower strength."

 wm_recruitment_event.7.title:0 "Form the Spanish Blue Division"
 wm_recruitment_event.7.desc:0 "The Spanish dictator Francisco Franco has offered to send a division of Spanish volunteers to fight alongside the Wehrmacht on the Eastern Front. This division will be made up of proper officers and soldiers of the Spanish Armed Forces, well prepared and motivated to fight the Bolsheviks. Due to their unique uniforms, they will be known as the 'Blue Division'. We should accept this offer and form the division."
 wm_recruitment_event.7.a:0 "Form the Spanish Blue Division."
 wm_recruitment_decision_7:0 "Form the Spanish Blue Division"
 GER_wm_recruitment_event.7.tt:0 "One §YInfantry Division §! will appear without equipment but full manpower strength."
 
 wm_recruitment_event.8.title:0 "Form the Italian Republican Army"
 wm_recruitment_event.8.desc:0 "The Italian Social Republic is a German puppet state led by Benito Mussolini after his rescue from imprisonment. We will form divisions from Italian prisoners of war, conscripts and volunteers to create the Italian Republican Army, which will fight alongside the Wehrmacht in Italy."
 wm_recruitment_event.8.a:0 "Form the Italian Republican Army."
 wm_recruitment_decision_8:0 "Form the Italian Republican Army"
 GER_wm_recruitment_event.8.tt:0 "Four weak §YInfantry Divisions §! will appear without equipment but full manpower strength."


 # Operation Valkyrie Decisions
 valkyrie_subversion_decisions:0 "Valkyrie Subversion"
 valkyrie_subversion_decision:0 "Rising Valkyrie Plotters Influence"
 valkyrie_subversion_tooltip:0 "The Valkyrie Plotters gradually gain influence as the war with the Soviet Union continues."
 valkyrie_now_is_the_time:0 "Now is the Time"
 valkyrie_now_is_the_time_tooltip:0 "The time has come to act. The Führer must die for Germany to be saved."


 # Operation Valkyrie Events
 valkyrie.1.title:0 "The German Resistance"
 valkyrie.1.desc:0 "Even with the extreme measures taken by Gestapo, SS, SA and the other internal security organisations, there remains a hardened core of resisters. They go deep underground or hide in plain sight. They are trades- and clergymen, politicians of banned parties, factory owners, students, workers, socialist and communist revolutionaries or even Wehrmacht officers and soldiers, often enough part of the regime they secretly oppose. They are the German Resistance. And until the end and often enough their own death they will not stop trying to change the course of history.\n\nThe most influential resistance groups were the Kreisau Circle, the Red Orchestra, the White Rose and the July 20th Plotters. They were all part of a larger network of resistance groups, which included the German Labour Front, the Confessing Church, the Social Democratic Party, and many others. The resistance was not a single organisation but a loose coalition of individuals and groups united by their opposition to the Nazi regime."
 valkyrie.1.option.a:0 "Monitor the situation closely."

 valkyrie.2.title:0 "The September Plot of 1938"
 valkyrie.2.desc:0 "Army Chief of Staff General Ludwig Beck and other high-ranking officers were planning a coup and to kill Hitler during the Sudetenland crisis should a war break out. Their motives weren't necessarily opposition to Hitlers immediate goals but their impression that Germany was not even close to being ready to go to war. The weak diplomatic response to Hitlers aggressive stance and finally the Munich Agreement prevented the execution of this plot. Many of the members of Becks circle were later involved in the 20th of July 1944 plot."
 valkyrie.2.option.a:0 "Keep me informed."
 valkyrie.2.option.b:0 "Mention only important attempts."

 valkyrie.3.title:0 "Maurice Bavaud's Assassination Attempt"
 valkyrie.3.desc:0 "A Swiss theology student named Maurice Bavaud attempted to assassinate the Führer during a commemoration ceremony on November 9, 1938, but was unable to get close enough due to Hitler being escorted by SA troopers. He was arrested for fare evasion while trying to leave Germany via train to Paris. Then the Gestapo found his plans and weapon. He was put on show trial and, abandoned by the Swiss government which even turned down to exchange him for a German spy, executed by guillotine in 1941."
 valkyrie.3.option.a:0 "A Forgotten Man."

 valkyrie.4.title:0 "The Bürgerbräukeller Bombing"
 valkyrie.4.desc:0 "Communist clockmaker, carpenter and armaments factory worker Georg Elser had been in passive opposition to the regime since 1933, denying to perform the Hitler salute and not listening to public Nazi propaganda radio programs. The aggressiveness and obvious war preparations of the regime conviced Elser he had to take action, and thus he put his learnt skills to use and build a bomb with parts stolen from his workplace. Secretly staying inside the Bürgerbräukeller overnight again and again over months he managed to hole out a pillar behind the speakers nostrum undetected and planted his bomb set to blow during the annual Beer Hall Putsch commemoration speech. The explosion occurred exactly at the right time killing seven and wounding sixty-three, but the Führer had left earlier than planned. Elser was arrested when trying to cross the border to Switzerland. Tortured, drugged and interogated in the most brutal ways by the Gestapo and reportedly Himmler himself, he wrote a confession. Held without trial in isolation until early 1945 at the Sachsenhausen concentration camp but for some reason receiving preferential treatment, Georg Elser was executed with a shot in the neck on Hitlers personal orders one month before the war ended."
 valkyrie.4.option.a:0 "Saved by sheer luck."

 valkyrie.5.title:0 "Erich Kordt's Attempt"
 valkyrie.5.desc:0 "German diplomat Erich Kordt planned to assassinate the Führer in the Reich Chancellery with a scuicide bomb but found the security too tight after Elsers attempt to carry out the plan."
 valkyrie.5.option.a:0 "The security is too tight."

 valkyrie.6.title:0 "Paris Victory Parade Attempt"
 valkyrie.6.desc:0 "Two German officers of the military resistance wanted to shoot Hitler during the Paris victory parade. But the Führer instead visited the city in secret and left, so the parade was cancelled."
 valkyrie.6.option.a:0 "He was already here?"

 valkyrie.7.title:0 "Cancelled Paris Visit"
 valkyrie.7.desc:0 "An assassination attempt was planned during the Führer's visit to Paris in May 1941, but the visit was cancelled at the last moment, likely because of the fighting in Yugoslavia and Greece."
 valkyrie.7.option.a:0 "The Balkan getting in the way."

 valkyrie.8.title:0 "Smolensk Airport Ambush"
 valkyrie.8.desc:0 "On March 13, 1943, military resistance members under Major Georg von Boeselager planned to ambush the Führer on his way from Smolensk airport to the local army headquarters. Unexpectedly, the SS provided a far heavier escort than anticipated."
 valkyrie.8.option.a:0 "There are too many guards."
 valkyrie.8.option.b:0 "Open fire!"

 valkyrie.9.title:0 "Smolensk Dinner Attempt"
 valkyrie.9.desc:0 "Later that same day, another attempt was planned by Henning von Tresckow, von Boeselager and others during dinner at the Smolensk army headquarters, but Himmler's absence complicated the plan. Without Himmler dying too, a civil war might have errupted. The assassination was aborted."
 valkyrie.9.option.a:0 "Without Himmler it's not worth it."
 valkyrie.9.option.b:0 "Shoot Hitler regardless."

 valkyrie.10.title:0 "The Frozen Bomb"
 valkyrie.10.desc:0 "Henning von Tresckow placed a bomb disguised as cognac bottles on the Führer's return flight from Smolensk, but the trigger mechanism was prown to freezing at high altitude."
 valkyrie.10.option.a:0 "The bomb trigger froze."
 valkyrie.10.option.b:0 "Report Soviet fighters in the air!"

 valkyrie.11.title:0 "Gersdorff's Suicide Mission"
 valkyrie.11.desc:0 "Rudolf von Gersdorff planned to detonate explosives during a military exhibition, but the Führer left the event earlier than expected."
 valkyrie.11.option.a:0 "Hitler already left."

 valkyrie.12.title:0 "The Destroyed Uniforms"
 valkyrie.12.desc:0 "Axel von dem Bussche planned a suicide bombing during a uniform demonstration, but the uniforms were destroyed in an allied air raid."
 valkyrie.12.option.a:0 "No presentation without uniforms."

 valkyrie.13.title:0 "Von Kleist's Attempt"
 valkyrie.13.desc:0 "Lieutenant von Kleist had prepared for a suicide bombing during a uniform presentation, but the Führer cancelled his appearance at the last moment. Another opportunity has slipped away."
 valkyrie.13.option.a:0 "He cancelled?!"

 valkyrie.14.title:0 "The Generals' Meeting"
 valkyrie.14.desc:0 "Captain von Breitenbruch planned to shoot the Führer during a military briefing, but security restrictions meant that only generals were allowed into the meeting room. The plan had to be abandoned."
 valkyrie.14.option.a:0 "No Aide-de-Camps allowed."

 valkyrie.15.title:0 "Stieff's Hesitation"
 valkyrie.15.desc:0 "Colonel Stieff had been given a bomb to use against the Führer during a military demonstration, but when the moment came, he found himself unable to carry out the act. The conspiracy continues to struggle with the human element."
 valkyrie.15.option.a:0 "Stieff just couldn't do it."

 valkyrie.16.title:0 "First Stauffenberg Attempt"
 valkyrie.16.desc:0 "Colonel von Stauffenberg has prepared for his first assassination attempt during a military briefing. However, the conspirators had hoped that both the Führer and Himmler would be present. Should they proceed with only one target?"
 valkyrie.16.option.a:0 "Himmler isn't there."
 valkyrie.16.option.b:0 "Hitler must die!"

 valkyrie.17.title:0 "Second Stauffenberg Attempt"
 valkyrie.17.desc:0 "Once more von Stauffenberg is in position for an assassination attempt, but Himmler is absent from the meeting again. The conspirators face the same dilemma as before. Time is running out for the resistance."
 valkyrie.17.option.a:0 "Himmler isn't there...again!"
 valkyrie.17.option.b:0 "Hitler must die!"

 valkyrie.18.title:0 "The Final Attempt"
 valkyrie.18.desc:0 "This is von Stauffenberg's final opportunity. The conspirators have grown desperate, and they can no longer afford to wait for the perfect moment, the last time they barely managed to conceal the aborted launch of Operation Valkyrie. The time has come to act, regardless of the consequences."
 valkyrie.18.option.a:0 "Damn Himmler, Hitler must die NOW!"

 valkyrie.100.title:0 "Operation Valkyrie"
 valkyrie.100.desc:0 "It is done. In whatever way it happened, the plotters around Henning von Tresckow and Claus von Stauffenberg believe the Führer is dead and have initiated Operation Valkyrie - the plan to seize control of the government, telecommunication channels, radio stations, Nazi party headquarters and SS barracks. Military commanders across the Reich await confirmation of the situation. The fate of Germany hangs in the balance."
 valkyrie.100.option.a:0 "The Führer survives!"
 valkyrie.100.option.b:0 "The Führer is dead! Göring takes over!"
 valkyrie.100.option.c:0 "Hitler is dead, Valkyrie succeeds!"

 valkyrie.101.title:0 "Who shall lead the Reich?"
 valkyrie.101.desc:0 "The Führer is dead, and the conspirators have taken control of the government. But who will lead the Reich now?\nGeneral Ludwig Beck has been secretly opposed to the Nazis for almost a decade, was one of the heads of the coup and is an excellent organiser with long leadership experience but is basically unknown to most.\nFeldmarschall Erwin Rommel is a supremely popular war hero, a capable officer and would help to rally especially the younger Germans to our cause, but had close ties to Hitler and has not been involved in Valkyrie in any way."
 valkyrie.101.option.a:0 "Ludwig Beck stays in charge." 
 valkyrie.101.option.b:0 "Erwin Rommel will ensure stability."

