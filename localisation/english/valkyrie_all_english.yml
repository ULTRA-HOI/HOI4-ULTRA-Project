l_english:
 # Operation Valkyrie Focus Tree
 GER_german_resistance:0 "A German Resistance"
 GER_german_resistance_desc:0 "The sweeping successes of the Nazi government might fool a lot of Germans, while many others prefer to stay silent. But not all have given up. Regular workers, clergymen, even Wehrmacht soldiers, people from all walks of life are realising the threat the Nazis pose to Germany and the world. And they resist."
 
 GER_waffen_ss_creation:0 "Creation of the Waffen-SS"
 GER_waffen_ss_creation_desc:0 "The expansion of the SS into a military force under Himmlers command and loyal to the NSDAP creates a parallel armed power structure to the Wehrmacht, leading to increased competition for resources and influence."
 
 GER_subverting_valkyrie:0 "Subverting Valkyrie"
 GER_subverting_valkyrie_desc:0 "As the war fully escalates, those Wehrmacht officers secrectly in opposition to the Nazis start to take meassures to subvert the precautionary plans on how to quell uprisings in the Reich into a plan for a coup against the regime. They are named...Walküre."
 
 GER_operation_valkyrie:0 "Operation Valkyrie"
 GER_operation_valkyrie_desc:0 "The Führer Adolf Hitler has to die for Germany to be saved from the brink of destruction. If it takes murder and rebellion to do so, so be it."

