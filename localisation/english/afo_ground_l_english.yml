    sov_heavy_td_equipment_7:0 "1944  @SOV  Heavy TD"
    SOV_sov_heavy_td_equipment_7:0 "ISU 122"
    sov_heavy_td_equipment_7_short:0 "ISU 122"
    sov_heavy_td_equipment_7_desc:0 "The ISU-122 was a heavy tank destroyer armed with a 122mm A-19S gun, developed in 1943. Based on the IS chassis, it was created to provide longer-range anti-tank firepower using the same hull but with a high-velocity gun instead of a howitzer. It featured strong frontal armor and excellent penetration capabilities, especially effective against heavy German tanks at distance. Although the gun had a slow rate of fire due to separate loading ammunition, the ISU-122 was accurate and deadly, and it served both as a tank destroyer and in a limited assault role through the end of the war and beyond."

