    ger_mechanized_equipment_1:0 "1939  @GER  Mechanized"
    GER_ger_mechanized_equipment_1:0 "Sd.Kfz. 251 A/B"
    ger_mechanized_equipment_1_short:0 "Sd.Kfz. 251 A/B"
    ger_mechanized_equipment_1_desc:0 "The Sd.Kfz. 251 A/B was an APC half-track armed with a 7.92mm MG34, developed in 1938. Designed to transport infantry into battle alongside tanks, it featured sloped armor for improved protection, a spacious rear compartment for a squad, and a tracked rear for cross-country mobility combined with wheeled steering. As the first of its type, it had a distinctive angular design and limited internal space due to early structural elements. While it offered good tactical flexibility and protection from small arms fire, it was complex to produce and lacked protection against heavier weapons."

    ger_mechanized_equipment_2:0 "1942  @GER  Mechanized"
    GER_ger_mechanized_equipment_2:0 "Sd.Kfz. 250 A & Sd.Kfz. 251 C"    
    ger_mechanized_equipment_2_short:0 "Sd.Kfz. 251 C"
    ger_mechanized_equipment_2_desc:0 "§YThis technology represents the mixed usage of these two vehicles in German mechanised infantry units.§!\nThe Sd.Kfz. 250 A was a light APC half-track armed with a 7.92mm MG34, developed in 1939. Intended to provide reconnaissance units with armored mobility, it had a shorter chassis compared to the Sd.Kfz. 251, sloped armor and space for a half-squad. The Sd.Kfz. 251 C featured simplified armor plates and altered crew arrangements to ease manufacturing as also allow for the option to carry 8cm Gw34 mortars."

    ger_mechanized_equipment_3:0 "1943  @GER  Mechanized"
    GER_ger_mechanized_equipment_3:0 "Sd.Kfz. 251 D & Sd.Kfz. 250 B"    
    ger_mechanized_equipment_3_short:0 "Sd.Kfz. 251 D"
    ger_mechanized_equipment_3_desc:0 "§YThis technology represents the mixed usage of these two vehicles in German mechanised infantry units.§!\nThe Sd.Kfz. 251 D & 250 B were simplified versions for easier mass production and improved crew access while maintaining the advantages of the designs. Additionally they were now capable of carrying either two MGs, a 2.8cm PzB, a 3.7cm AT gun or even flame throwers."

    ger_mechanized_equipment_4:0 "1946 @GER Mechanized"    
    GER_ger_mechanized_equipment_4:0 "Vollkettenmannschaftsfahrzeug Kätzchen"    
    ger_mechanized_equipment_4_short:0 "Kätzchen"
    ger_mechanized_equipment_4_desc:0 "The VKMfz Kätzchen was a fully tracked APC armed with a 7.92mm MG42, developed in 1945 as a more mobile and better protected alternative to half-tracks. Featuring an open-topped hull but heavier armor all around, it combined improved survivability with simpler construction. Built on tank components with a tracked chassis and powered by a diesel engine, it offered excellent cross-country performance and better range. It was capable of mounting either two MGs, various 2cm, 3cm or 3.7cm autocannons, an 8cm mortar or even a 7.5cm AT gun."

    ger_amphibious_mechanized_equipment_1:0 "1941  @GER  Amphibious Mechanized"
    GER_ger_amphibious_mechanized_equipment_1:0 "Landwasserschlepper"    
    ger_amphibious_mechanized_equipment_1_short:0 "LWS"
    ger_amphibious_mechanized_equipment_1_desc:0 "The Landwasserschlepper (LWS) was an amphibious tractor developed in 1936 for engineering and logistical tasks during amphibious operations. Designed with a boat-like hull and fully tracked propulsion, it could operate both on land and in water, ferrying supplies, equipment, or even towing landing barges ashore. It was unarmed and lightly armored, relying on its specialized role and mobility rather than protection. While complex and limited in production, it served in several riverine and coastal operations where regular vehicles could not operate."

    ger_amphibious_mechanized_equipment_2:0 "1943  @GER  Amphibious Mechanized"
    GER_ger_amphibious_mechanized_equipment_2:0 "Landwasserschlepper 2"    
    ger_amphibious_mechanized_equipment_2_short:0 "LWS 2"
    ger_amphibious_mechanized_equipment_2_desc:0 "The Landwasserschlepper 2 was an amphibious tractor developed in 1944 to improve upon shortcomings of the LWS. Built on a Panzer IV chassis with a fully enclosed armored hull and powered by the same Maybach engine, it offered significantly better protection, land mobility, towing capacity and a pintle-mount. Designed to support amphibious assaults and river crossings by towing barges or transporting equipment across water, it retained full amphibious capability through twin rear-mounted propellers."

    ger_amphibious_mechanized_equipment_3:0 "1945  @GER  Amphibious Mechanized"
    GER_ger_amphibious_mechanized_equipment_3:0 "LWS 3"    
    ger_amphibious_mechanized_equipment_3_short:0 "LWS 3"
    ger_amphibious_mechanized_equipment_3_desc:0 "Better armored and more reliable, this vehicle is designed toward large scale naval invasions"

    ger_mechanized_artillery_equipment_2:0 "Sd.Kfz. 251/1 Stuka"    
    GER_ger_mechanized_artillery_equipment_2:0 "Sd.Kfz. 251/1 Stuka zu Fuß"    
    ger_mechanized_artillery_equipment_2_short:0 "Sd.Kfz. 251/1 Stuka"
    ger_mechanized_artillery_equipment_2_desc:0 "The Sd.Kfz. 251/1 Stuka zu Fuß was self-propelled rocket artillery armed with six 28cm or 32cm Wurfrahmen 40 rocket launchers, developed in 1941. Based on the Sd.Kfz. 251 Ausf. B, it featured wooden or metal launch frames mounted on the sides of the hull for short-range artillery support. Nicknamed 'Stuka zu Fuß' (Stuka on Foot) for its howling rocket noise reminiscent of dive bombers, it delivered devastating high-explosive or incendiary barrages. Crude and inaccurate but effective in urban and fortified environments, it added vital firepower to infantry assaults."

    ger_mechanized_artillery_equipment_3:0 "Sd.Kfz. 4/1 Panzerwerfer 42"    
    GER_ger_mechanized_artillery_equipment_3:0 "Sd.Kfz. 4/1 Panzerwerfer 42"    
    ger_mechanized_artillery_equipment_3_short:0 "Sd.Kfz. 4/1 Panzerwerfer 42"
    ger_mechanized_artillery_equipment_3_desc:0 "The Sd.Kfz. 4/1 Panzerwerfer 42 was a self-propelled rocket artillery armed with a 15-cm-Nebelwerfer 42, developed in 1943. Based on the Sd.Kfz. 4 half-track with added protection, it carried a ten-barrel launcher capable of firing high-explosive rockets in rapid succession. Designed to provide mobile rocket support, it combined firepower with survivability and tactical flexibility. Though inaccurate and slow to reload, it was highly effective for saturation bombardment and disrupting enemy formations."

    ger_mechanized_artillery_equipment_4:0 "8-cm Vielfachwerfer"    
    GER_ger_mechanized_artillery_equipment_4:0 "8-cm Vielfachwerfer"    
    ger_mechanized_artillery_equipment_4_short:0 "8-cm Vielfachwerfer"
    ger_mechanized_artillery_equipment_4_desc:0 "The 8-cm Vielfachwerfer was a self-propelled rocket artillery armed with sixteen 8-cm-Raketenwerfer, developed in 1943 from the Soviet BM-13. Mounted on half-tracks such as the Sd.Kfz. 4 or captured French vehicles, it was intended to provide area bombardment with rapid salvos of rockets. The launcher was fully traversable and elevated electrically, allowing quick adjustments in fire direction. Though less powerful than the Nebelwerfer, the 8-cm Vielfachwerfer was simpler, lighter, and had a higher rate of fire, making it suitable for fast, disruptive strikes."

    ger_scout_car_equipment_1:0 "1934  @GER  Armored Car"
    GER_ger_scout_car_equipment_1:0 "Sd.Kfz. 221"
    ger_scout_car_equipment_1_short:0 "Sd.Kfz. 221"
    ger_scout_car_equipment_1_desc:0 "The Sd.Kfz. 221 was an armored car armed with a 7.92-mm MG34, developed in 1935. During their secret maneuvers in the Soviet Union the Wehrmacht recognized the need for a light, armored scout car. Designed for reconnaissance duties, it featured a compact layout with a two-man crew, light armor, and high road mobility. Its open-topped turret and weak armament limited combat effectiveness, but it was adequate for scouting and security tasks in the early stages of the war. The light chassis struggled in rough terrain, and the vehicle offered only minimal protection."

    ger_scout_car_equipment_2:0 "1936  @GER  Armored Car"
    GER_ger_scout_car_equipment_2:0 "Sd.Kfz. 222"
    ger_scout_car_equipment_2_short:0 "Sd.Kfz. 222"
    ger_scout_car_equipment_2_desc:0 "The Sd.Kfz. 222 was an armored car armed with a 2-cm-KwK 30 L/55, developed in 1936. Based on the earlier Sd.Kfz. 221, it introduced a larger turret, a three-man crew, and increased firepower with its autocannon, making it more capable against infantry and light vehicles. Light armor and an open-topped turret limited protection, but the vehicle remained highly mobile and effective for reconnaissance roles."

    ger_scout_car_equipment_3:0 "1941  @GER  Armored Car"
    GER_ger_scout_car_equipment_3:0 "Sd.Kfz. 221 PzB41"
    ger_scout_car_equipment_3_short:0 "Sd.Kfz. 221"
    ger_scout_car_equipment_3_desc:0 "The Sd.Kfz. 221 PzB41 was an armored car armed with a 2.8-cm schwere Panzerbüchse 41, developed in 1941. This late modification of the original Sd.Kfz. 221 replaced the ineffective MG 34 with a taper-bore anti-tank gun capable of penetrating much thicker armor than its size suggested. While still lightly armored and vulnerable, this variant significantly improved the vehicle's usefulness against enemy armor in reconnaissance and support roles."

    ger_scout_car_equipment_4:0 "1937  @GER  Armored Car"
    GER_ger_scout_car_equipment_4:0 "Sd.Kfz. 231"
    ger_scout_car_equipment_4_short:0 "Sd.Kfz. 231"
    ger_scout_car_equipment_4_desc:0 "The Sd.Kfz. 231 was an armored car armed with a 2-cm-KwK 30 L/55 gun. Developed in 1937, its relatively thin armor was angled in a way that provided significant protection. Notably bigger and heavier than previous modelsand equipped with an eight-wheeled chassis, it featured all-wheel drive and steering, providing good mobility on roads and moderate cross-country capability. This advanced vehicle was the predecessor of all German armored cars up until the 1970s."

    ger_scout_car_equipment_5:0 "1943  @GER  Armored Car"
    GER_ger_scout_car_equipment_5:0 "Sd.Kfz. 234"
    ger_scout_car_equipment_5_short:0 "Sd.Kfz. 234"
    ger_scout_car_equipment_5_desc:0 "The Sd.Kfz. 234 was an armored car armed with a 5-cm-KwK 39 L/60, developed in 1943. Designed as a more advanced successor to earlier eight-wheeled designs, it featured a new monocoque hull, improved suspension, air-cooled diesel engine and better cross-country performance. Well-armed for its class, it offered a good mix of firepower, speed and protection for reconnaissance roles, though it remained lightly armored. It was the pinnacle of German WW2 armored cars."

    ger_scout_car_equipment_6:0 "Schützenpanzer Kurz"
    GER_ger_scout_car_equipment_6:0 "Schützenpanzer Kurz"
    ger_scout_car_equipment_6_short:0 "Schützenpanzer Kurz"
    ger_scout_car_equipment_6_desc:0 "The Schützenpanzer Kurz was a slightly modified armored vehicle produced by the French Hotchkiss corporation and armed with a HS 820 L/85 20mm gun. Developed in the 1950s, it was the first dedicated tracked scout vehicle of the German forces, deemed necessary in more difficult terrain where wheeled vehicles might struggle. "

    ger_light_equipment_0:0 "1934  @GER  Medium Tank"
    GER_ger_light_equipment_0:0 "Panzerkampfwagen I Ausf. A"
    ger_light_equipment_0_short:0 "Panzer I A"
    ger_light_equipment_0_desc:0 "The Panzer I Ausf. A was a medium tank armed with two 7.92mm MG13s, developed in 1934. Intended primarily as a training and infantry support vehicle, it featured light armor, a two-man crew and simple construction. While highly mobile and easy to produce, it was completely unsuited for combat against armored opposition and rather vulnerable on the battlefield. Its main significance lay in jumpstarting German armored forces. Speed and reliability were excellent though, making the tank suitable for War of Movement."

    ger_light_equipment_1:0 "1937  @GER  Medium Tank"
    GER_ger_light_equipment_1:0 "Panzerkampfwagen II Ausf. A"
    ger_light_equipment_1_short:0 "Panzer II A"
    ger_light_equipment_1_desc:0 "The Panzerkampfwagen II A was a medium tank armed with a 2-cm-KwK 30 L/55. Going into production in 1937, it was basically an enlarged and improved Panzer I able to pierce other light tanks. Featuring a three-man crew, enhanced mobility, and better armament than the Panzer I, it was intended for recon and infantry support. Although still lightly armored and undergunned against most tanks, it offered a practical platform and helped refine German armored warfare doctrine."

    ger_light_equipment_2:0 "1940  @GER  Medium Tank"
    GER_ger_light_equipment_2:0 "Panzerkampfwagen II Ausf. F"
    ger_light_equipment_2_short:0 "Panzer II F"
    ger_light_equipment_2_desc:0 "The Panzer II F was an improved model of the original tank developed in 1940 armed with a 2-cm-KwK 38 L/55 as the final and heaviest version of the Panzer II series. It featured improved armor protection with a redesigned hull front and thicker plates, while retaining good mobility and the same armament. Intended for recon and infantry support, it was increasingly outclassed in frontline combat due to its weak gun and armor, but remained in use in secondary roles."

    ger_light_equipment_3:0 "1938  @GER  Medium Tank"
    GER_ger_light_equipment_3:0 "Panzerkampfwagen 38(t)"
    ger_light_equipment_3_short:0 "Panzer 38(t)"
    ger_light_equipment_3_desc:0 "AVAILABLE IF TRUE\n§YHas full control of Bohemia§!\nThe Panzer 38(t) was a medium tank armed with a 3.7-cm-KwK 38(t) L/47.8, originally developed in Czechoslovakia as the LT vz.38 and adopted by Germany after the annexation in 1939. It featured good reliability, decent mobility and effective armor and armament for its class. Its riveted construction and limited upgrade potential became drawbacks, but it was more cost-effective than most comparable German designs."
    
    ger_light_equipment_3_5:0 "1940  @GER  Medium Tank"
    GER_ger_light_equipment_3_5:0 "Panzerkampfwagen 38(t) Ausf. F"
    ger_light_equipment_3_5_short:0 "Panzer 38(t) F"
    ger_light_equipment_3_5_desc:0 "The Panzer 38(t) Ausf. F was a medium tank armed with a 3.7-cm-KwK 38(t) L/47.8, introduced in 1941 as the final production variant of the Czech-designed tank. It featured increased armor protection with welded 50mm frontal plates thus decreasing crew injuries, while maintaining the reliable suspension, good mobility and compact profile that made the type so successful early in the war. Despite these improvements, its light armament made it increasingly obsolete on the frontlines, though it continued to serve in secondary roles and as a basis for more advanced vehicles."
    
    ger_light_equipment_4:0 "1942  @GER  Light Tank"
    GER_ger_light_equipment_4:0 "Panzer II Luchs"    
    ger_light_equipment_4_short:0 "Panzer II Luchs"
    ger_light_equipment_4_desc:0 "The Panzer II Luchs was a light tank armed with a 2-cm-KwK 38 L/55, developed in 1942 as a dedicated reconnaissance vehicle and a major redesign of the obsolete Panzer II. It featured a lengthened chassis, interleaved road wheels, an additional crew member, improved speed, range, and cross-country performance, along with better armor. Despite its excellent mobility and suitability for reconnaissance, its armament made it ineffective against anything but light targets."

    ger_light_equipment_5:0 "1944  @GER  Light Tank"
    GER_ger_light_equipment_5:0 "Leopard"
    ger_light_equipment_5_short:0 "Leopard"
    ger_light_equipment_5_desc:0 "The Leopard was a light tank armed with a 5-cm-KwK 39 L/60, in development until 1943 as a dedicated reconnaissance vehicle and almost total redesign of the Panzer II chassis. It featured sloped but still thin armor, a powerful engine for high speed and excellent cross-country capability, and the same gun as the Panzer III for significantly enhanced firepower. Despite its strengths, it was too complex and costly for mass production in its intended role."

    ger_light_equipment_6:0 "1946  @GER  Light Tank"
    GER_ger_light_equipment_6:0 "E 10"
    ger_light_equipment_6_short:0 "E 10"
    ger_light_equipment_6_desc:0 "The E-10 was a light tank armed with a 7.5-cm-Pak 39 L/48 gun, developed until 1945. Part of the standardization program called Entwicklungsserie, it was a highly unusual recon tank with a secondary tank destroyer role. Its chassis could be lowered pneumatically by 40% for better concealment in ambush positions, making it extremely dangerous on the defense."

    ger_light_td_equipment_1:0 "1939  @GER  Medium TD"
    GER_ger_light_td_equipment_1:0 "Panzerjäger I"
    ger_light_td_equipment_1_short:0 "Panzerjäger I"
    ger_light_td_equipment_1_desc:0 "The Panzerjäger I was the first dedicated German meidum tank destroyer, armed with a Czechoslovakian 4.7-cm-Pak 36(t) L/43. A 1940 attempt to convert the obsolete Panzer I into a more useful vehicle, it was cheap, quickly available and could engage most tanks of its era but had serious reliability issues due to the added weight of the gun. The armor was lacking and only thick enough to resist small arms fire."
    
    ger_light_1:0 "1941 @GER Medium TD"
    GER_ger_light_1:0 "Panzerjäger Marder I/II/III"
    ger_light_1_short:0 "Marder I/II/III"
    ger_light_1_desc:0 "The Marder series were medium tank destroyers armed with captured Soviet 7.62-cm or German 7.5-cm anti-tank guns. Developed from 1942 as a stopgap to counter the growing threat of heavily armored Soviet tanks, they mounted powerful guns on obsolete chassis. All were lightly armored, open-topped and vulnerable to infantry and artillery, but they offered mobility and firepower. The Marder I got converted from obsolete French tanks, the Marder II from the Panzer I and Panzer II, while the Marder III was based on the Panzer 38(t) chassis."

    ger_light_td_equipment_1_5:0 "1941  @GER  Medium TD"
    GER_ger_light_td_equipment_1_5:0 "Marder I"
    ger_light_td_equipment_1_5_short:0 "Marder I"
    ger_light_td_equipment_1_5_desc:0 "The Marder I medium tank destroyer was armed with either a 7.5-cm-Pak 40 or a captured Soviet 76mm M1942 gun redesignated 7.62-cm-Feldkanone 288(r). Developed in 1942 on the initiative of Major Alfred Becker, the need for heavier and mobile anti-tank firepower after encountering modern Soviet tanks warranted the conversion of a variety of captured French vehicles into just good enough tank destroyers."
    
    ger_light_td_equipment_2:0 "1942  @GER  Medium TD"
    GER_ger_light_td_equipment_2:0 "Marder II"
    ger_light_td_equipment_2_short:0 "Marder II"
    ger_light_td_equipment_2_desc:0 "The Marder II was a medium tank destroyer armed with either a 7.5-cm-Pak 40 or a captured Soviet 76mm M1942 gun redesignated 7.62-cm-Feldkanone 288(r). Designed in 1942 after it became evident that German tank destroyer units needed stronger firepower, this vehicle was a quick solution to the problem. Relatively nimble and equipped with a good gun, it suffered from thin armor and an open crew compartment."

    ger_light_td_equipment_3:0 "1944  @GER  Medium TD"
    GER_ger_light_td_equipment_3:0 "Jagdpanzer 38 Hetzer"
    ger_light_td_equipment_3_short:0 "Hetzer"
    ger_light_td_equipment_3_desc:0 "The Jagdpanzer 38 was a medium tank destroyer armed with a 7.5-cm-Pak 39 L/48, developed in 1944. Due to the rapidly increasing need for mobile armored anti-tank units, a heavily modified version of the chassis of the Panzer 38(t) was used to create a tank destroyer with thin but heavily sloped armor. It was cheap, reliable and difficult to spot or hit at range, making it effective in defensive roles. Quick to produce and very well armed, it was relatively uncomfortable with mediocre visibility."

    ger_light_td_equipment_4:0 "1942  @GER  Medium TD"
    GER_ger_light_td_equipment_4:0 "Panzerjäger Marder III"
    ger_light_td_equipment_4_short:0 "Marder III"
    ger_light_td_equipment_4_desc:0 "The Marder III was a medium tank destroyer armed with either a 7.5-cm-Pak 40 or a captured Soviet 76mm M1942 gun redesignated 7.62-cm-Feldkanone 288(r). Designed in 1942 after the heavily armored Soviet tanks caused many issues for the German tank destroyer units, it provided very good mobility and firepower, even if it was open-topped and only featured very weak armor."

    ger_light_td_equipment_5:0 "1944  @GER  Medium TD"
    GER_ger_light_td_equipment_5:0 "Jagdpanzer Leopard"
    ger_light_td_equipment_5_short:0 "Jagdpanzer Leopard"
    ger_light_td_equipment_5_desc:0 "The Jagdpanzer Leopard was a medium tank destroyer armed with a 7.5-cm-Pak 42 L/70 in development until 1943. Based on the Leopard, it combined high speed, low silhouette, and powerful armament for its size, but with still rather thin armor and very high production costs."

    ger_light_td_equipment_6:0 "1947  @GER  Medium TD"
    GER_ger_light_td_equipment_6:0 "Jagdpanzer E 25"
    ger_light_td_equipment_6_short:0 "Jagdpanzer E 25"
    ger_light_td_equipment_6_desc:0 "The E-25 was a medium tank destroyer armed with a 7.5-cm-Pak 42 L/70. Designed as part of the German E-series in 1944, it aimed to replace outdated tank destroyers with a standardised, simplified and more efficient vehicle. It featured well-sloped armor, a low profile, high mobility due to a powerful Maybach engine, and ease of maintenance through modular components while being optimised for mass production."
    
    ger_light_spg_equipment_1:0 "1939  @GER  Medium SP Artillery"
    GER_ger_light_spg_equipment_1:0 "15-cm-sIG 33 (Sf) auf Panzerkampfwagen I B"
    ger_light_spg_equipment_1_short:0 "sIG 33 auf Panzer I B"
    ger_light_spg_equipment_1_desc:0 "The 15-cm-sIG 33 (Sf) auf Panzer I B was a medium self-propelled artillery armed with a 15-cm-sIG 33. Developed in 1939 as a stopgap to provide infantry with mobile heavy fire support, it mounted the massive gun on a modified Panzer I B chassis. The result was a very cramped, overloaded and top-heavy vehicle with limited mobility and protection. It had serious reliability issues owing to the overloaded chassis. The 13mm of armor also weren’t anything to boast about, barely stopping small arms fire and shell fragments."

    ger_light_spg_equipment_2:0 "1940  @GER  Medium SP Artillery"
    GER_ger_light_spg_equipment_2:0 "15-cm-sIG 33 (Sf) auf Panzerkampfwagen II"
    ger_light_spg_equipment_2_short:0 "sIG 33 auf Panzer II"
    ger_light_spg_equipment_2_desc:0 "The sIG 33 auf Panzer II was a medium self-propelled artillery armed with a 15-cm-sIG 33. Developed in 1941 to improve on the earlier Panzer I-based designs, it mounted the same heavy infantry gun on a lengthened Panzer II chassis with six road wheels. This provided better mobility, a slightly more stable firing platform, and more space for the crew, but the vehicle remained underprotected and overloaded. Featuring only very weak armor and mediocre reliability, it packed quite a punch nonetheless."

    ger_light_spg_equipment_3:0 "1943  @GER  Medium SP Artillery"
    GER_ger_light_spg_equipment_3:0 "15-cm-sIG 33 (Sf) auf Panzer 38t Grille"
    ger_light_spg_equipment_3_short:0 "Grille"
    ger_light_spg_equipment_3_desc:0 "The Grille was a medium self-propelled artillery armed with a 15-cm-sIG 33. Developed in 1942 to provide mobile heavy fire support to Panzergrenadier units, it was based on the Panzer 38(t) chassis and produced in two main versions, with the engine in the rear and the gun in the center or with the engine in the center and gun at the rear. Compact, mobile, and reliable, the Grille was a good support weapon but offered minimal armor protection and limited ammunition capacity with a quite short firing range, a general problem of the gun."

    ger_light_spg_equipment_4:0 "1942  @GER  Medium SP Artillery"
    GER_ger_light_spg_equipment_4:0 "10.5 cm leFH 18/2 (Sf) auf Panzerkampfwagen II Wespe"
    ger_light_spg_equipment_4_short:0 "Wespe"
    ger_light_spg_equipment_4_desc:0 "The Wespe was a medium self-propelled artillery armed with a 10,5-cm-leFH 18. Designed in late 1941 as a fire support vehicle for armored divisions, it was based on a modified Panzer II chassis with the engine moved forward to accommodate a rear-mounted gun. The vehicle offered good mobility but had thin armor and limited crew protection. Rugged, reliable, cheap and with solid firepower for its size, the Wespe had quite a sting. It was widely regarded as the most successful use of the otherwise outdated Panzer II platform."

    ger_light_spg_equipment_5:0 "1944  @GER  Medium SP Artillery"
    GER_ger_light_spg_equipment_5:0 "Geschützwagen Leopard"
    ger_light_spg_equipment_5_short:0 "Geschützwagen Leopard"
    ger_light_spg_equipment_5_desc:0 "The Geschützwagen Leopard was a medium self-propelled artillery with a 10,5-cm-leFH 18/40. Based on the Leopard chassis, it was intended to serve as a fast, lightly armored artillery for Panzer divisions. Featuring a rear-mounted fighting compartment and excellent cross-country mobility, it combined modern design elements with the proven light howitzer. Nonetheless its open top and weak armor were still a problem, also its firepower was not up to scratch anymore."

    ger_light_aa_equipment_1:0 "1940  @GER  SPAA"
    GER_ger_light_aa_equipment_1:0 "Flakpanzer I"
    ger_light_aa_equipment_1_short:0 "Flakpanzer I"
    ger_light_aa_equipment_1_desc:0 "The Flakpanzer I was a self-propelled anti air armed with a 2-cm-Flak 38. Since motorized AA wasn’t sufficiently armored, the Heereswaffenamt designed this vehicle in 1941. Though reliable, its gun wasn’t very effective against aircraft and the completely open turret gave little to no cover for its crew."

    ger_light_aa_equipment_2:0 "Flakpanzer II"
    GER_ger_light_aa_equipment_2:0 "Flakpanzer II"
    ger_light_aa_equipment_2_short:0 "Flakpanzer II"
    ger_light_aa_equipment_2_desc:0 "Self Propelled Anti-Air on a Panzer II chassis"

    ger_light_aa_equipment_3:0 "1943  @GER  SPAA"
    GER_ger_light_aa_equipment_3:0 "Flakpanzer 38(t)"
    ger_light_aa_equipment_3_short:0 "Flakpanzer 38(t)"
    ger_light_aa_equipment_3_desc:0 "The Flakpanzer 38(t) was a self-propelled anti-air armed with a 2-cm-Flak 38. Designed in 1943 due to the growing threat of the Allied airforces, this vehicle based on the sturdy Panzer 38(t) chassis was a quick, cheap and reliable solution. Its small, open-topped turret gave limited crew protection and its gun proved inadequate in firepower."

    ger_light_aa_equipment_5:0 "Gepard"
    GER_ger_light_aa_equipment_5:0 "Gepard"
    ger_light_aa_equipment_5_short:0 "Gepard"
    ger_light_aa_equipment_5_desc:0 "Self Propelled Anti-Air on a Leopard chassis"

    ger_support_tank_equipment_1:0 "1938  @GER  Heavy Medium Tank"
    GER_ger_support_tank_equipment_1:0 "Panzerkampfwagen IV"
    ger_support_tank_equipment_1_short:0 "Panzer IV"
    ger_support_tank_equipment_1_desc:0 "The Panzer IV was a heavy medium tank armed with a 7.5-cm-KwK 37 L/24. With the first combat-capable version entering production in 1938, the Panzer IV supported German tank formations with high-explosive fire from its short-barreled main gun against enemy infantry and gun emplacements. Its anti-tank capabilities were extremely limited in return."

    ger_support_tank_equipment_2:0 "1940  @GER  Heavy Medium Tank"
    GER_ger_support_tank_equipment_2:0 "Panzerkampfwagen IV Ausf. D-F"
    ger_support_tank_equipment_2_short:0 "Panzer IV (D-F)"
    ger_support_tank_equipment_2_desc:0 "The Panzer IV D-F was a medium tank armed with a 7.5-cm-KwK 37 L/24 gun, designed from 1940 on primarily for infantry support and close-range combat. It featured significantly improved armor protection over previous models, with up to 50mm on the front hull and turret, offering better survivability against anti-tank fire. Retaining the same general layout as earlier versions but sporting an improved Maybach HL-120 engine and hollow-charge ammunition against armored targets, it also was optimized for mass production."

    ger_support_tank_equipment_3:0 "PzKpfw IV Ausf. F"
    GER_ger_support_tank_equipment_3:0 "PzKpfw IV Ausf. F"
    ger_support_tank_equipment_3_short:0 "Panzer IV F"
    ger_support_tank_equipment_3_desc:0 "Heavy-Medium Tank"

    ger_support_tank_equipment_4:0 "1942  @GER  Heavy Medium Tank"
    GER_ger_support_tank_equipment_4:0 "Panzerkampfwagen III Ausf. N"
    ger_support_tank_equipment_4_short:0 "Panzer III N"
    ger_support_tank_equipment_4_desc:0 "The Panzer III N was a heavy medium tank armed with a 7.5-cm-KwK 37 L/24. Developed in 1943 to fill the gap left by the Panzer IV transitioning in the role of the main tank of the Panzer-Divisions, the Panzer III was armed with the now unused short-barreled cannons of its bigger brother, turning it into a support tank. It featured additional armor and was supremely optimized for mass production."

    ger_assault_artillery_equipment_2:0 "1940  @GER  Assault Gun"
    GER_ger_assault_artillery_equipment_2:0 "Sturmgeschütz III Ausf. A"
    ger_assault_artillery_equipment_2_short:0 "StuG III A"
    ger_assault_artillery_equipment_2_desc:0 "The StuG III A was a medium assault gun armed with a 7.5-cm-StuK 37 L/24, first produced in 1940. An idea by then-colonel Erich von Manstein, the StuG III was the first assault gun of the world, optimized and very well suited to support the infantry in frontal assaults on fortified positions with direct fire support at close distance, omitting the turret for heavier frontal armor and a lower profile."

    ger_assault_artillery_equipment_3:0 "1940  @GER  Medium SP Artillery"
    GER_ger_assault_artillery_equipment_3:0 "Sturm-Infantriegeschütz 33B"
    ger_assault_artillery_equipment_3_short:0 "StuIG 33B"
    ger_assault_artillery_equipment_3_desc:0 "The StuIG 33B was a heavy assault gun armed with a 15-cm-sIG 33/1, developed in 1942 on a StuG III chassis. It featured 80mm frontal armor, a boxy superstructure with limited gun traverse and provided direct fire support against fortified positions. The enclosed fighting compartment offered better crew protection than open-topped conversions, though it was cramped with poor visibility. Mobility was limited due to high weight, but firepower and protection were significant."

    ger_assault_artillery_equipment_4:0 "1942  @GER  Assault Gun"
    GER_ger_assault_artillery_equipment_4:0 "Sturmhaubitze 42 Ausf. G"
    ger_assault_artillery_equipment_4_short:0 "StuH 42 G"
    ger_assault_artillery_equipment_4_desc:0 "The StuH 42 G was a medium assault gun armed with a 10.5-cm-StuH 42, developed in 1942. Based on the chassis of the StuG III, this vehicle was the proper replacement for the StuG III A. Easy to produce, relatively nimble, good firepower and 80mm of armor turned it into a great weapon for direct assaults on dug-in enemies and fortified positions."

    ger_assault_artillery_equipment_5:0 "1943  @GER  Heavy Assault Gun"
    GER_ger_assault_artillery_equipment_5:0 "Sturmpanzer (IV)"
    ger_assault_artillery_equipment_5_short:0 "StuPa"
    ger_assault_artillery_equipment_5_desc:0 "The Sturmpanzer was a heavy assault gun armed with a 15cm sIG StuH 43 L/12, developed in 1943. Built on the Panzer IV chassis, it featured a tall, heavily armored superstructure to protect the crew during direct assaults. Its primary role was to support infantry in urban and fortified environments, delivering devastating high-explosive firepower against bunkers and strongpoints. Despite its effectiveness in this role, it was hampered by poor mobility and an overburdened suspension."

    ger_medium_equipment_1:0 "1938  @GER  Medium Tank"
    GER_ger_medium_equipment_1:0 "Panzerkampfwagen III E-F"
    ger_medium_equipment_1_short:0 "Panzer III (E-F)"
    ger_medium_equipment_1_desc:0 "The Panzer III was a medium tank armed with a 3.7-cm-KwK 36 L/45, first entering full production in 1939. Quick, relatively lightly armed and armored the Panzer III was nonetheless an excellent vehicle setting the standard for optimal crew size for decades to come. With its 3-man-turret, intercom and radio system it allowed for superior coordination compared to other designs and coordinated high speed advances, the core of the German combined arms warfare."

    ger_medium_equipment_2:0 "1940  @GER  Medium Tank"
    GER_ger_medium_equipment_2:0 "Panzerkampfwagen III Ausf. G-H"
    ger_medium_equipment_2_short:0 "Panzer III (G-H)"
    ger_medium_equipment_2_desc:0 "The Panzer III G-H was a medium tank armed with a 5-cm-KwK 38 L/42. Introduced in 1940, it had additional armor and a new torsion bar suspension system, improving both protection and off-road performance. While its firepower remained limited against more heavily armored opponents, it was well-suited for engaging lighter vehicles and supporting infantry. It marked a key step in evolving the Panzer III series toward greater battlefield survivability and combat capability."
    
    ger_medium_equipment_3:0 "1942  @GER  Medium Tank"
    GER_ger_medium_equipment_3:0 "Panzerkampfwagen III Ausf. L"
    ger_medium_equipment_3_short:0 "Panzer III L"
    ger_medium_equipment_3_desc:0 "The Panzer III L was a German medium tank armed with a 5-cm-KwK 39 L/60, developed in 1941. It featured improved frontal armor and an upgraded main gun capable of dealing with more heavily armored opponents, finally giving the Panzer III a reasonable anti-tank capability. Additional refinements included spaced armor on the gun mantlet and frontal hull. It retained excellent optical equipment and a well-organized interior, which made it efficient in combat despite its increasingly limited firepower."

    ger_medium_equipment_4:0 "1942  @GER  Medium Tank"
    GER_ger_medium_equipment_4:0 "Panzerkampfwagen IV Ausf. G"
    ger_medium_equipment_4_short:0 "Panzer IV G"
    ger_medium_equipment_4_desc:0 "The Panzer IV G was a medium tank armed with the 7.5-cm-KwK 40 L/43. Introduced in 1942, it marked a significant shift in the Panzer IVs role toward that of the German main tank combat platform. While retaining the same chassis, the G version added much thicker frontal armor, now up to 80mm with applique plates, improving protection significantly. It could now engage enemy medium tanks effectively at range, though its side and rear armor remained vulnerable. The G thus formed a key transition toward heavier, more combat-effective variants of the Panzer IV."

    ger_medium_equipment_5:0 "1944  @GER  Medium Tank"
    GER_ger_medium_equipment_5:0 "Panzerkampfwagen IV Ausf. H"
    ger_medium_equipment_5_short:0 "Panzer IV H"
    ger_medium_equipment_5_desc:0 "The Panzer IV H was a medium tank armed with the 7.5-cm-KwK 40 L/48. Introduced in 1943, it featured major improvements in protection with 80mm of solid frontal armor and additional skirt armor on the sides to defend against anti-tank rifles and shaped charges. Also the cannon barrel was lengthened somewhat to increase gun performance. This added weight, reducing mobility and straining the chassis, but the firepower and armor made it a formidable opponent. It represented the peak of the Panzer IVs evolution."

    ger_medium_equipment_6:0 "1944  @GER  Medium Tank"
    GER_ger_medium_equipment_6:0 "Panzerkampfwagen IV Ausf. J"
    ger_medium_equipment_6_short:0 "Panzer IV J"
    ger_medium_equipment_6_desc:0 "The Panzer IV J was a medium tank armed with the 7.5-cm-KwK 40 L/48. Produced from early 1944, it focused on simplifying production while maintaining combat effectiveness. Armor remained largely unchanged and it retained the turret side skirts, though the turret roof armor was thickened, balancing improved crew protection with streamlined manufacturing. This made it a reliable and efficient frontline tank. It was largely as capable as the previous variant while being easier to produce, the biggest drawback being the removal of the electric turret drive."

    ger_medium_equipment_7:0 "Panzerkampfwagen IV Ausf. N"
    GER_ger_medium_equipment_7:0 "Panzerkampfwagen IV Ausf. N"
    ger_medium_equipment_7_short:0 "Panzer IV N"
    ger_medium_equipment_7_desc:0 ""

    ger_medium_td_equipment_3:0 "1942  @GER  Medium TD"
    GER_ger_medium_td_equipment_3:0 "Sturmgeschütz III Ausf. F"
    ger_medium_td_equipment_3_short:0 "StuG III F"
    ger_medium_td_equipment_3_desc:0 "The StuG III F was a medium tank destroyer armed with a 7.5-cm-StuK 40 L/43. Entering production in 1942, the StuG III F was a direct result of encountering heavily armored Soviet tanks. Largely omitting its infantry support role, this cheap, reliable and hard-hitting tank hunter was capable of piercing most enemy tanks, massively increasing the combat capability of anti-tank units."
    
    ger_medium_td_equipment_3_5:0 "1942  @GER  Medium TD"
    GER_ger_medium_td_equipment_3_5:0 "Sturmgeschütz III Ausf. G"
    ger_medium_td_equipment_3_5_short:0 "StuG III G"
    ger_medium_td_equipment_3_5_desc:0 "The StuG III G was a medium tank destroyer armed with a 7.5-cm-StuK 40 L/48. Developed in 1943 to further improve the StuG IIIs anti-tank performance, it featured a longer gun and somewhat improved armor, making it the most cost-effective tank destroyer available to the Germany Army."

    ger_medium_td_equipment_4:0 "1943  @GER  Heavy TD"
    GER_ger_medium_td_equipment_4:0 "Nashorn"
    ger_medium_td_equipment_4_short:0 "Nashorn"
    ger_medium_td_equipment_4_desc:0 "The Nashorn was a heavy tank destroyer armed with a 8.8-cm-Pak 43/1 L/71. Developed in 1943 on the same combined chassis as the Hummel to combat any tank the enemy might come up with, this vehicle featured devastating firepower and high mobility, but was seriously lacking armor and crew protection."

    ger_medium_td_equipment_5:0 "1943  @GER  Medium TD"
    GER_ger_medium_td_equipment_5:0 "Sturmgeschütz IV"
    ger_medium_td_equipment_5_short:0 "StuG IV"
    ger_medium_td_equipment_5_desc:0 "The StuG IV was a medium tank destroyer armed with a 7.5-cm-StuK 40 L/48. Developed in 1943 after the main factory for the StuG III had been destroyed, this vehicle combined the Panzer IV chassis with the StuG III superstructure to a new, similar design. It did not differ much from the original one, but provided the crew with a bigger fighting compartment."

    ger_medium_td_equipment_6:0 "1944  @GER  Medium TD"
    GER_ger_medium_td_equipment_6:0 "Jagdpanzer IV"
    ger_medium_td_equipment_6_short:0 "Jagdpanzer IV"
    ger_medium_td_equipment_6_desc:0 "The Jagdpanzer IV was a medium tank destroyer armed with a 7.5-cm-Pak 39 L/48. Developed in 1943 to replace both the StuG III and IV as dedicated anti-tank vehicle, it featured increased and highly sloped frontal armor while removing the turret of the regular model, resulting in a cost-effective vehicle with a low silhouette well suited for anti-tank ambush tactics."

    ger_medium_td_equipment_7:0 "Jagdpanzer IV"
    GER_ger_medium_td_equipment_7:0 "Jagdpanzer IV"
    ger_medium_td_equipment_7_short:0 "Jagdpanzer IV"
    ger_medium_td_equipment_7_desc:0 "The Jagdpanzer IV was a medium tank destroyer armed with a 7.5-cm-Pak 39 L/48. Developed in 1943 to replace both the StuG III and IV as dedicated anti-tank vehicle, it featured increased and highly sloped frontal armor while removing the turret of the regular model, resulting in a cost-effective vehicle with a low silhouette well suited for anti-tank ambush tactics."

    ger_medium_spg_equipment_4:0 "1942  @GER  Heavy SP Artillery"
    GER_ger_medium_spg_equipment_4:0 "Hummel"
    ger_medium_spg_equipment_4_short:0 "Hummel"
    ger_medium_spg_equipment_4_desc:0 "The Hummel was a heavy self-propelled artillery armed with a 15-cm-sFH 18. Developed in 1942 with parts from both the Panzer III and IV, it was arguably the best armored artillery of its time. Featuring a devastating gun, high mobility and a reliable and easily to produce chassis, it was a very good addition for the artillery battalions of German mobile formations despite its improvised nature."
    
    ger_medium_aa_equipment_3:0 "1943  @GER  SPAA"
    GER_ger_medium_aa_equipment_3:0 "Flakpanzer IV Möbelwagen"
    ger_medium_aa_equipment_3_short:0 "Möbelwagen"
    ger_medium_aa_equipment_3_desc:0 "The Flakpanzer IV was a self-propelled anti-air armed with a 3.7-cm Flak 43 L/89, developed in 1943. Due to the increasing aerial combat impact, armored anti-air vehicles had become a necessity. This vehicle might have been a stopgap solution but nonetheless an improvement over regular anti-air units."
    
    ger_medium_aa_equipment_4:0 "1944  @GER  SPAA"
    GER_ger_medium_aa_equipment_4:0 "Wirbelwind"
    ger_medium_aa_equipment_4_short:0 "Wirbelwind"
    ger_medium_aa_equipment_4_desc:0 "A German Self Propelled Anti-Air on a Panzer IV chassis"

    ger_medium_aa_equipment_5:0 "1944 @GER  SPAA"
    GER_ger_medium_aa_equipment_5:0 "Flakpanzer IV Ostwind"
    ger_medium_aa_equipment_5_short:0 "Ostwind"
    ger_medium_aa_equipment_5_desc:0 "The Ostwind was a self-propelled anti-air armed with a 3.7-cm Flak 43 L/89, developed in 1944. Since the Möbelwagen failed to provide adequate protection for its crew, this vehicle was designed. Now featuring a proper, if open-topped turret for the gun, the Ostwind was a dangerous foe for every plane in its range."

    ger_medium_aa_equipment_6:0 "1944  @GER  SPAA"
    GER_ger_medium_aa_equipment_6:0 "Flakpanzer IV Kugelblitz"
    ger_medium_aa_equipment_6_short:0 "Kugelblitz"
    ger_medium_aa_equipment_6_desc:0 "The Kugelblitz was a self-propelled anti-air armed with dual 3-cm-Flak 103/38 guns. Developed in 1944 it introduced a whole bunch of new concepts for anti-air vehicles like a fully armored oscillating turret, hydraulic turret rotation system, stereo-periscope commander optics coupled with the gunners optics and for the first time in Germany belt-fed autocannons, making it the most advanced AAA of the war."

    ger_medium_aa_equipment_7:0 "Kugelblitz"
    GER_ger_medium_aa_equipment_7:0 "Kugelblitz"
    ger_medium_aa_equipment_7_short:0 "Kugelblitz"
    ger_medium_aa_equipment_7_desc:0 ""

    ger_modern_equipment_1:0 "1943  @GER  Medium Tank"
    GER_ger_modern_equipment_1:0 "Panzerkampfwagen V Panther Ausf. D"
    ger_modern_equipment_1_short:0 "Panther D"
    ger_modern_equipment_1_desc:0 "The Panther D was a medium tank armed with a 7.5-cm-KwK 42 L/70. Introduced in 1943 to finally counter the Soviet T-34, the Panther was a supreme vehicle for its time, finally featuring angled armor, an excellent gun and very broad tracks. Able to pierce any enemy tank, combined with its heavy armor and good mobility it was a very strong tank but suffered from a problematic engine as also high production costs."

    ger_modern_equipment_1_1:0 "1944  @GER  Medium Tank"
    GER_ger_modern_equipment_1_1:0 "Panzerkampfwagen V Panther Ausf. G"
    ger_modern_equipment_1_1_short:0 "Panther G"
    ger_modern_equipment_1_1_desc:0 "The Panther G was a medium tank armed with a 7.5-cm-KwK 42 L/70. Introduced in 1944 to address reliability issues as also to simplify production and remove armor weakspots it is the best and final version of the original production model."

    ger_modern_equipment_2:0 "1944  @GER  Medium Tank"
    GER_ger_modern_equipment_2:0 "Panzerkampfwagen Panther II"
    ger_modern_equipment_2_short:0 "Panther II"
    ger_modern_equipment_2_desc:0 "The Panther II was a medium tank armed with a 7.5-cm-KwK 42 L/70. Developed only shortly in 1943, the Panther II was basically an uparmored, slightly enlarged and improved Panther. Featuring a new, narrower turret with improved armor and optics it was significantly tougher than its predecessor while also much more reliable."

    ger_modern_equipment_3:0 "1945  @GER  Medium Tank"
    GER_ger_modern_equipment_3:0 "Panzerkampfwagen V Panther Ausf. F"
    ger_modern_equipment_3_short:0 "Panther F"
    ger_modern_equipment_3_desc:0 "The Panther F was a medium tank armed with a 7.5-cm-KwK 42 L/70. Developed in 1944 to improve the still unsatisfactory turret armor of the Panther, it swapped out the whole turret for a completely new, narrower design with an improved gun mantlet, a heavy frontal plate and new optics. Combined with all the other improvements, this resulted in a massively superior design compared to the initial D version, very well suited for offensive and defensive operations."
    
    ger_modern_equipment_31:0 "1945  @GER  Medium Tank"
    GER_ger_modern_equipment_31:0 "Panzerkampfwagen Panther Ausf. F mit 8.8cm Kanone"
    ger_modern_equipment_31_short:0 "Panther F 8.8cm"
    ger_modern_equipment_31_desc:0 "The Panther F 8.8cm was a medium tank armed with an 8.8-cm-KwK 43 L/71. Developed in 1945, it was an attempt to further upgun the Panther design since the enemy designs were starting to catch up in terms of armor. With this very powerful gun the Panther chassis would have reached its maximum capacity though, slowly starting to suffer from the again increased weight."
    
    ger_modern_equipment_4:0 "1945  @GER  Medium Tank"
    GER_ger_modern_equipment_4:0 "Panzerkampfwagen Panther II mit 8.8cm Kanone"
    ger_modern_equipment_4_short:0 "Panther II 8.8"
    ger_modern_equipment_4_desc:0 "The Panther II 8.8cm was a medium tank armed with an 8.8-cm-KwK 43 L/71. Never actually proposed, it would have been the most powerful version of the Panther lineage. Combining the agility and reliability of the Panther II with one of the most powerful guns of the war would have resulted in a costly but very capable vehicle."

    ger_modern_equipment_5:0 "1946  @GER  Medium Tank"
    GER_ger_modern_equipment_5:0 "E 50"
    ger_modern_equipment_5_short:0 "E 50"
    ger_modern_equipment_5_desc:0 "The E-50 was a medium tank armed with an 8.8-cm-KwK 43 L/71. First proposed already in 1942, the E-50 was part of an attempt to streamline and optimize tank production across a whole so-called Entwicklungsserie (development series). Combining parts from various previous tanks and newly developed, unified components for the different weight classes of the E-series, this vehicle would have been the new mainstay of the German armored forces ready for true mass production."

    ger_modern_equipment_6:0 "1948  @GER  Medium Tank"
    GER_ger_modern_equipment_6:0 "E 50 M"
    ger_modern_equipment_6_short:0 "E 50 M"
    ger_modern_equipment_6_desc:0 "The E-50M was a medium tank armed with a 10.5-cm-KwK 46 L/52. A fictional improved version of the E-50 Standardpanzer, the E-50M combined all possible upgrades for the E-50 into one vastly improved model. It would also be sporting a new main gun derived from the 10.5-cm-Pak and newly developed discarding sabot ammunition based on captured British equipment, making it a very powerful vehicle."

    ger_modern_equipment_7:0 "E 60"
    GER_ger_modern_equipment_7:0 "E 60"
    ger_modern_equipment_7_short:0 "E 60"
    ger_modern_equipment_7_desc:0 "Heavy armored 50's German Battle Tank"

    ger_modern_equipment_8:0 "Leopard I"
    GER_ger_modern_equipment_8:0 "Leopard I"
    ger_modern_equipment_8_short:0 "Leopard I"
    ger_modern_equipment_8_desc:0 "The Leopard 1 was a modern main battle tank armed with a 105-mm-L7A3 L/52, a German licensed version of the British Royal Ordnance model. Being the first post-WW2 tank introduced in the new West German army, it fully embraced the concept of fast movement and precise fire, while eschewing heavy armor. Incredible fast, nimble and with devastating firepower, it is highly liked by all armies deploying it and still in service in a number of countries."

    ger_modern_td_equipment_2:0 "1944  @GER  Heavy TD"
    GER_ger_modern_td_equipment_2:0 "Jagdpanzer V Jagdpanther"
    ger_modern_td_equipment_2_short:0 "Jagdpanther"
    ger_modern_td_equipment_2_desc:0 "The Jagdpanzer V was a heavy tank destroyer armed with a 8.8-cm-PjK 43 L/71. First produced in January 1944, this beast of a dedicated tank hunter featured extremely sloped frontal armor, very high mobility and devastating firepower to become the ultimate anti-tank vehicle of its time. It was quite costly though and suffered from somewhat low reliability."
    
    ger_modern_td_equipment_2_5:0 "1945  @GER  Heavy TD"
    GER_ger_modern_td_equipment_2_5:0 "Jagdpanther II"
    ger_modern_td_equipment_2_5_short:0 "Jagdpanther II"
    ger_modern_td_equipment_2_5_desc:0 "The Jagdpanther II was a medium tank destroy armed with a 12.8-cm-PjK 44 L/55, proposed in late 1943. Sporting the most powerful available gun on the improved Panther II chassis this vehicle had absolutely incredible firepower combined with pretty tough armor. The significant weight increase reduced its speed and reliability quite a bit though."

    ger_modern_td_equipment_3:0 "1945  @GER  Medium TD"
    GER_ger_modern_td_equipment_3:0 "Skorpion"
    ger_modern_td_equipment_3_short:0 "Skorpion"
    ger_modern_td_equipment_3_desc:0 "A German Tank Destroyer based on the Panther II chassis."
    
    ger_modern_td_equipment_3_5:0 "Panzerjäger Panther"
    GER_ger_modern_td_equipment_3_5:0 "Panzerjäger Panther"
    ger_modern_td_equipment_3_5_short:0 "Panzerjäger Panther"
    ger_modern_td_equipment_3_5_desc:0 "A German Tank Destroyer based on the Panther chassis."

    ger_modern_td_equipment_5:0 "Jagdpanzer E 50"
    GER_ger_modern_td_equipment_5:0 "Jagdpanzer E 50"
    ger_modern_td_equipment_5_short:0 "Jagdpanzer E 50"
    ger_modern_td_equipment_5_desc:0 "The Jagdpanzer E-50 was a medium tank destroyer armed with a 12.8-cm-PjK 44 L/55. Proposed together with the E-50, this vehicle was supposed to replace the Jagdpanther. Optimized for mass production and ease of spare part supply, it would have been the definitive anti tank platform for the German tank hunter units."

    ger_modern_spg_equipment_2:0 "1944  @GER  Heavy SP Artillery"
    GER_ger_modern_spg_equipment_2:0 "Geschützwagen Panther"
    ger_modern_spg_equipment_2_short:0 "Geschützwagen Panther"
    ger_modern_spg_equipment_2_desc:0 "The Geschützwagen Panther was a heavy self-propelled artillery armed with a 15-cm-sFH 43. Developed in 1944, this armored artillery vehicle was the definitive answer to the ever increasing need of long-range fire support required by the German mobile combined arms doctrine, defensively and offensively."

    ger_modern_spg_equipment_3:0 "RB Panther"
    GER_ger_modern_spg_equipment_3:0 "RB Panther"
    ger_modern_spg_equipment_3_short:0 "RB Panther"
    ger_modern_spg_equipment_3_desc:0 "Self Propelled Artillery on a Panther II chassis."

    ger_modern_spg_equipment_5:0 "Geschützwagen E 50"
    GER_ger_modern_spg_equipment_5:0 "Geschützwagen E 50"
    ger_modern_spg_equipment_5_short:0 "Geschützwagen E 50"
    ger_modern_spg_equipment_5_desc:0 "The Geschützwagen E-50 was a medium self-propelled artillery armed with a 15-cm-sFH 43. Proposed together with the E-50, this vehicle was supposed to replace the aging Hummel based on the Panzer III and IV. Providing the same firepower on a significantly more durable, easy to produce and repair chassis while also being faster and better armored, the Gw E-50 would have been a great successor."

    ger_modern_aa_equipment_2:0 "1944  @GER  SPAA"
    GER_ger_modern_aa_equipment_2:0 "Flakpanzer V Coelian"
    ger_modern_aa_equipment_2_short:0 "Coelian"
    ger_modern_aa_equipment_2_desc:0 "The Flakpanzer V was a medium self-propelled anti-air armed with a 3.7-cm-Flak 341 designed in 1944. Built on the very good Panther chassis, it was a quite well armored if somewhat overengineered vehicle and probably a bit big for its not that strong armament."
 
    ger_modern_aa_equipment_4:0 "Flakpanzer E 50"
    GER_ger_modern_aa_equipment_4:0 "Flakpanzer E 50"
    ger_modern_aa_equipment_4_short:0 "Flakpanzer E 50"
    ger_modern_aa_equipment_4_desc:0 "The Flakpanzer E-50 was a medium self-propelled anti-air armed with a dual 5.5-cm-Gerät 58. Proposed together with the E-50, this vehicle was supposed to replace all lighter and older AAA in the German forces. Due to its significantly stronger gun mounted in an advanced turret, it would have been the absolute nightmare of any enemy pilot straying too close."

    ger_heavy_equipment:0 "German Heavy Tank"
    ger_heavy_equipment_short:0 "German Heavy Tank"
    ger_heavy_equipment_desc:0 "German Heavy Tank"
    ger_heavy_spg_equipment:0 "German Heavy SPG"
    ger_heavy_spg_equipment_short:0 "German Heavy SPG"
    ger_heavy_spg_equipment_desc:0 "German Heavy SPG"
    ger_heavy_td_equipment:0 "German Heavy TD" 
    ger_heavy_td_equipment_short:0 "German Heavy TD"
    ger_heavy_td_equipment_desc:0 "German Heavy TD"

    ger_heavy_equipment_0:0 "1934  @GER  Heavy Tank"
    GER_ger_heavy_equipment_0:0 "Neubaufahrzeug"
    ger_heavy_equipment_0_short:0 "Neubaufahrzeug"
    ger_heavy_equipment_0_desc:0 "The Neubaufahrzeug was a heavy tank armed with a  7.5-cm-KwK 37 L/24 and a 3.7-cm-KwK 36 L/45 as also two separate MG turrets sporting MG34s. This lumbering behemoth of a supposed medium tank was put into service in 1936. As an utter failure, it was too heavy, too slow, the mixed armament was problematic in terms of ammunition storage, the vibrating chassis made precise aiming very difficult, its armor was far too thin for such a big vehicle and the additional MG turrets caused communication issues."

    ger_heavy_equipment_1:0 "1939  @GER  Heavy Tank"
    GER_ger_heavy_equipment_1:0 "Durchbruchswagen 2"
    ger_heavy_equipment_1_short:0 "Durchbruchswagen 2"
    ger_heavy_equipment_1_desc:0 "The Durchbruchswagen 2 was a heavy tank armed with a 7.5-cm-KwK 37 L/24. As essentially an enlarged but similarly armed Panzer IV, the DW2 was the first true heavy tank design worked upon by German engineers from 1937 on. Laying the groundwork for the far more famous later developments, it had a comparatively thin armor and rather weak armament, ultimately not stronger than the first improved Panzer IV."

    ger_heavy_equipment_2:0 "Panzerkampfwagen VI Tiger Ausf. P"
    GER_ger_heavy_equipment_2:0 "Tiger P"
    ger_heavy_equipment_2_short:0 "Tiger P"
    ger_heavy_equipment_2_desc:0 ""

    ger_heavy_equipment_3:0 "1942  @GER  Heavy Tank"
    GER_ger_heavy_equipment_3:0 "Panzerkampfwagen VI Tiger Ausf. E"
    ger_heavy_equipment_3_short:0 "Tiger I"
    ger_heavy_equipment_3_desc:0 "The Tiger I was a heavy tank armed with an 8.8-cm-KwK 36 L/56. First produced in 1942, this famous vehicle was the most heavily armed and armored of its kind at the time. Designed to combat and defeat the strongest Soviet tanks, its main gun was capable of piercing anything that stood in its way, and its armor could shrug off even the heaviest available enemy anti-tank guns. While being more nimble than one would expect, it was a complicated and quite intricate machine that needed a lot of maintenance and was difficult to produce."

    ger_heavy_equipment_4:0 "1944  @GER  Heavy Tank"
    GER_ger_heavy_equipment_4:0 "Panzerkampfwagen Tiger Ausf. B"
    ger_heavy_equipment_4_short:0 "Tiger II"
    ger_heavy_equipment_4_desc:0 "The Tiger II was a heavy tank armed with an 8.8-cm-KwK 43 L/71. Developed in 1943 initially as just an improved Tiger I with a bigger gun, the whole project quickly became a much different beast, literally. Adopting sloped armor and an improved turret face as also a long 8.8cm gun, this vehicle was the ultimate German heavy tank of the Second World War with almost unrivaled firepower. With massive armor and gun came equally massive drawbacks, the Tiger II was very unreliable, slow and extremely costly to produce."

    ger_heavy_equipment_5:0 "Lowe"
    GER_ger_heavy_equipment_5:0 "Lowe"
    ger_heavy_equipment_5_short:0 "Lowe"
    ger_heavy_equipment_5_desc:0 ""

    ger_heavy_equipment_6:0 "1946  @GER  Heavy Tank"
    GER_ger_heavy_equipment_6:0 "E 75"
    ger_heavy_equipment_6_short:0 "E 75"
    ger_heavy_equipment_6_desc:0 "The E-75 was a heavy tank armed with an 8.8-cm-KwK 43 L/71. Part of the planned E series of tanks meant to standardize parts across all tanks of the German forces in 1945 and ease mass production, this vehicle was the natural progression from the Tiger II. Being a heavier armored version of the E-50 it would still have been capable of breaking even the heaviest of defenses while featuring a reinforced suspension and improved engine to stay at least as mobile as its predecessor, while thanks to standardization being actually much cheaper to produce."

    ger_heavy_equipment_7:0 "1948  @GER  Heavy Tank"
    GER_ger_heavy_equipment_7:0 "E 75 M"
    ger_heavy_equipment_7_short:0 "E 75 M"
    ger_heavy_equipment_7_desc:0 "The E-75M was a heavy tank armed with a 12.8-cm-KwK 44 L/55. This fictional improved version of the E-75 would have been even better armed than the original model while also incorporating various other improvements including even stronger armor. Together with the new Sabot ammunition, this heavy tank would have been an incredible force on the battlefield and capable of overcoming almost any opposition having the misfortune standing between it and its objective."

    ger_heavy_td_equipment_2:0 "1943  @GER  Heavy TD"
    GER_ger_heavy_td_equipment_2:0 "Schwerer Panzerjäger Tiger (P) "Ferdinand" "
    ger_heavy_td_equipment_2_short:0 "Ferdinand"
    ger_heavy_td_equipment_2_desc:0 "The Ferdinand was a super-heavy tank destroyer armed with an 8.8-cm-PjK 43/2 L/71. Initially produced in 1942 as hulls for the Porsche Tiger project which then lost out against the Henschel prototype, it was decided to use the already existing hulls as basis for a heavy tank hunter, named after the head of the Porsche company. The resulting vehicle was heavily armored and featured devastating firepower, but was as reliable as its original prototype: Not at all."

    ger_heavy_td_equipment_3:0 "1941  @GER  Heavy TD"
    GER_ger_heavy_td_equipment_3:0 " "Sturer Emil" "
    ger_heavy_td_equipment_3_short:0 "Sturer Emil"
    ger_heavy_td_equipment_3_desc:0 "German Heavy Tank Destroyer"

    ger_heavy_td_equipment_4:0 "1944  @GER  Super Heavy TD"
    GER_ger_heavy_td_equipment_4:0 "Schwerer Panzerjäger "Jagdtiger" "
    ger_heavy_td_equipment_4_short:0 "Jagdtiger"
    ger_heavy_td_equipment_4_desc:0 "The Jagdtiger was a super-heavy tank destroyer armed with a 12.8-cm-Pjk 44 L/55. Prototyped in early 1944, this monstrous vehicle was the pinnacle of German tank destroyers of the Second World War. Its huge gun was capable of destroying any enemy target at extreme range and its armor was largely impervious to any return fire. It was however even heavier than the Tiger II, extremely slow and a big target. It was very unreliable and while cheaper than its parent tank, still costly."

    ger_heavy_td_equipment_6:0 "Jagdpanzer E 75"
    GER_ger_heavy_td_equipment_6:0 "Jagdpanzer E 75"
    ger_heavy_td_equipment_6_short:0 "Jagdpanzer E 75"
    ger_heavy_td_equipment_6_desc:0 "The Jagdpanzer E-75 was a heavy tank destroyer armed with a 12.8-cm-PjK 44 L/55. Based on the chassis of the E-75 and proposed with it, this anti-tank vehicle combined the gun of the Jagdtiger with the casemate design of the Jagdpanther. Exceptionally heavily armored and armed, the Jagdpanzer E-75 was capable of destroying almost any enemy tank he faces at extreme range while shrugging off any return fire."

    ger_heavy_td_equipment_7:0 "Jagdpanzer E 70"
    GER_ger_heavy_td_equipment_7:0 "Jagdpanzer E 70"
    ger_heavy_td_equipment_7_short:0 "Jagdpanzer E 70"
    ger_heavy_td_equipment_7_desc:0 "German Heavy Tank Destroyer based on the E 75 M chassis"

    ger_heavy_spg_equipment_3:0 "1944  @GER  Heavy Assault Gun"
    GER_ger_heavy_spg_equipment_3:0 "Sturmtiger"
    ger_heavy_spg_equipment_3_short:0 "Sturmtiger"
    ger_heavy_spg_equipment_3_desc:0 "The Sturmtiger was a super-heavy assault gun armed with an 38-cm-Sturmmörser RW61 L/5.4. Developed in late 1943, this behemoth was designed to assault the most heaviest of fortifications and smash them utterly. Its weapon was originally meant to be mounted on uboats for coastal bombardments and fired a huge rocket-propelled, armor-piercing grenade. While it was incredible imprecise and reloading took half a Thirds Reich lifetime, it was able to destroy any fortification and sported massively thick armor. "

    ger_heavy_spg_equipment_4:0 "1944  @GER  Heavy SP Artillery"
    GER_ger_heavy_spg_equipment_4:0 "Geschützwagen Tiger"
    ger_heavy_spg_equipment_4_short:0 "Geschützwagen Tiger"
    ger_heavy_spg_equipment_4_desc:0 "The Geschützwagen Tiger was a heavy self-propelled artillery armed with a 17-cm-Kanone K18. Developed from 1944 on as a way to increase the mobility of the heavy artillery, the GW Tiger was an incredible devastating and long ranged weapon. Able to provide relatively accurate firepower of the highest magnitude, it suffered from the excessive weight and high production costs of its gun."

    ger_heavy_spg_equipment_6:0 "Geschützwagen E 75"
    GER_ger_heavy_spg_equipment_6:0 "Geschützwagen E 75"
    ger_heavy_spg_equipment_6_short:0 "Geschützwagen E 75"
    ger_heavy_spg_equipment_6_desc:0 "The Geschützwagen E-75 was a self-propelled artillery armed with a 21-cm-Kanone 38. This fictional artillery system would have featured one of the heaviest and modern German artillery pieces on a lightly armored chassis derived from the E-75. Capable of pounding even the most spirited resistance into submission at huge range, the vehicle still would have suffered from the very high weight of its armament, weak armor, slow reload time and a relatively low ammunition load."

    ger_heavy_spg_equipment_7:0 "Geschützwagen E 70"
    GER_ger_heavy_spg_equipment_7:0 "Geschützwagen E 70"
    ger_heavy_spg_equipment_7_short:0 "Geschützwagen E 70"
    ger_heavy_spg_equipment_7_desc:0 "Heavy Self Propelled Artillery based on a E 75 M chassis."

    ger_super_heavy_equipment:0 "German Super Heavy Tank"
    ger_super_heavy_equipment_short:0 "German Super Heavy Tank"
    ger_super_heavy_equipment_desc:0 "German Super Heavy Tank"
    
    ger_super_heavy_equipment_1:0 "1944  @GER  Super Heavy Tank"
    GER_ger_super_heavy_equipment_1:0 "Maus"
    ger_super_heavy_equipment_1_short:0 "Maus"
    ger_super_heavy_equipment_1_desc:0 "The Maus was a super-heavy tank armed with a 12.8-cm-KwK L/55 and a 7.5-cm-KwK 44 L/36.5. Proposed by Porsche and Prototyped in 1944 this colossal machine was the ultimate result of the drive to prioritize weapon and armor over literally anything else. While it excelled at both, its speed was virtually nonexistent, turning the tank into little more than a moving bunker. Its reliability was at least questionable, the production costs off the charts. And it should not have tried to use bridges. Except if you didn’t like bridges."

    ger_super_heavy_equipment_2:0 "1946  @GER  Super Heavy Tank"
    GER_ger_super_heavy_equipment_2:0 "E 100"
    ger_super_heavy_equipment_2_short:0 "E 100"
    ger_super_heavy_equipment_2_desc:0 "The E-100 was a super-heavy tank armed with a 15-cm-KwK 44 L/38. Developed from 1942 on by the Adler-Werke, this vehicle was the only one of the E series tanks to reach something close to completion. With less armor, thus higher speed and a stronger gun than the Maus this monstrosity was actually mildly more viable. Somewhat cheaper but still very costly to produce, the E-100 was still less than useful on the battlefield."

    ger_amphibious_tank_equipment_1:0 "1940  @GER  Amphibious Tank"
    GER_ger_amphibious_tank_equipment_1:0 "Schwimmpanzer II"
    ger_amphibious_tank_equipment_1_short:0 "Schwimmpanzer II"
    ger_amphibious_tank_equipment_1_desc:0 "The Schwimmpanzer II was an amphibious version of the Panzer II. Fitted with additional floatation devices and a propeller, it looked a bit like a boat. It was surprisingly quick and quite stable, making it a solid early amphibious tank for river crossings or naval invasion support."
    
    ger_amphibious_tank_equipment_3:0 "1940  @GER  Amphibious Tank"
    GER_ger_amphibious_tank_equipment_3:0 "Schwimmpanzer 38(t)"
    ger_amphibious_tank_equipment_3_short:0 "Schwimmpanzer 38(t)"
    ger_amphibious_tank_equipment_3_desc:0 "The Schwimmpanzer 38(t) was the amphibious version of the regular model. First drawn up in 1940, it was fitted with additional floatation devices and a propeller similar to the Schwimmpanzer II. Due to its pretty good gun, it would have added a nice extra punch to any river crossing or naval invasion but never went into production"
    
    ger_amphibious_tank_equipment_2:0 "1940  @GER  Amphibious Tank"
    GER_ger_amphibious_tank_equipment_2:0 "Tauchpanzer III"
    ger_amphibious_tank_equipment_2_short:0 "Tauchpanzer III"
    ger_amphibious_tank_equipment_2_desc:0 "The Tauchpanzer III was the amphibious version of the regular Panzer III. Developed in 1940, it was a relatively simple conversion, all openings were sealed with rubber, duct tape and tar. Sporting a bilge pump and an 18 meters long snorkel hose tied to a buoy with radio antenna, it was meant to drive on the ground of the English Channel for the invasion of the United Kingdom. They were also useful for opposed river crossings."
    
    ger_amphibious_tank_equipment_4:0 "1940  @GER  Amphibious Tank"
    GER_ger_amphibious_tank_equipment_4:0 "Tauchpanzer IV"
    ger_amphibious_tank_equipment_4_short:0 "Tauchpanzer IV"
    ger_amphibious_tank_equipment_4_desc:0 "The Tauchpanzer IV was the amphibious version of the regular Panzer IV. Developed in 1940 parallel to the Tauchpanzer III, it featured the same equipment and purpose."
    
    sov_mechanized_equipment_1:0 "1938  @SOV  Mechanized"
    SOV_sov_mechanized_equipment_1:0 "GAZ-MM"
    sov_mechanized_equipment_1_short:0 "GAZ-MM"
    sov_mechanized_equipment_1_desc:0 "The GAZ-MM was a light military truck with a 2.8-liter four-cylinder gasoline engine, developed in 1938. It was an improved version of the earlier GAZ-AA, featuring a more powerful 50 hp engine derived from the GAZ-M1, which enhanced performance under load. The design remained simple and robust, well-suited for mass production and general utility."
    
    sov_mechanized_infantry_1:0 "GAZ-MM"
    sov_mechanized_infantry_1_short:0 "GAZ-MM"
    sov_mechanized_infantry_1_desc:0 "The GAZ-MM was a light military truck with a 2.8-liter four-cylinder gasoline engine, developed in 1938. Featuring a more powerful 50hp engine derived from the GAZ-M1, which enhanced performance under load. The design remained simple and robust, well-suited for mass production and general utility."

    sov_mechanized_equipment_2:0 "ZIS 42"    
    SOV_sov_mechanized_equipment_2:0 "ZIS 42"    
    sov_mechanized_equipment_2_short:0 "ZIS 42"
    sov_mechanized_equipment_2_desc:0 ""

    sov_mechanized_equipment_3:0 "1946  @SOV  Mechanized"
    SOV_sov_mechanized_equipment_3:0 "BTR 152"
    sov_mechanized_equipment_3_short:0 "BTR 152"
    sov_mechanized_equipment_3_desc:0 "The BTR-152 was a wheeled armored personnel carrier developed in 1950, based on the ZIS-151 truck chassis. It featured an open-topped armored hull for up to 18 troops and was typically armed with a 7.62mm or 12.7mm machine gun. Designed to provide protected mobility for motorized infantry, it offered good road performance and basic protection against small arms fire. However, its open top and limited off-road capability were notable weaknesses. Despite this, it was widely used and marked a key step in postwar Soviet mechanized infantry development."

    sov_mechanized_equipment_4:0 "BTR 50"
    SOV_sov_mechanized_equipment_4:0 "BTR 50"
    sov_mechanized_equipment_4_short:0 "BTR 50"
    sov_mechanized_equipment_4_desc:0 ""

    sov_mechanized_equipment_5:0 "BTR 60"
    SOV_sov_mechanized_equipment_5:0 "BTR 60"
    sov_mechanized_equipment_5_short:0 "BTR 60"
    sov_mechanized_equipment_5_desc:0 ""

    sov_mechanized_artillery_equipment_1:0 "BM 13 Katyusha"    
    SOV_sov_mechanized_artillery_equipment_1:0 "BM 13 Katyusha Motorized Rocket Launcher"    
    sov_mechanized_artillery_equipment_1_short:0 "BM 13"
    sov_mechanized_artillery_equipment_1_desc:0 "The BM-13 Katyusha was a motorised multiple rocket launcher armed with 132mm M-13 rockets, developed in 1939. Mounted on trucks, it was the first mass-produced system of its kind, designed to deliver rapid, concentrated fire over a wide area. It offered devastating firepower and high mobility, allowing quick strikes and fast withdrawal. Though inaccurate, slow to reload, and lightly protected, it had a major psychological impact and became a key asset of Soviet artillery forces."

    sov_mechanized_artillery_equipment_2:0 "BM 31 Katyusha"    
    SOV_sov_mechanized_artillery_equipment_2:0 "BM 31 Katyusha"    
    sov_mechanized_artillery_equipment_2_short:0 "BM 31"
    sov_mechanized_artillery_equipment_2_desc:0 "The BM-31 was a motorised multiple rocket launcher armed with 300 mm M-31 rockets, developed in 1943. Designed as a heavier counterpart to the BM-13 Katyusha, it was mounted on truck chassis and carried twelve launch rails. It delivered far greater explosive power, ideal for striking fortified positions and dense troop concentrations. Though inaccurate and slow to reload, its mobility and shock effect made it a valuable weapon in late-war Soviet offensives."

    sov_mechanized_artillery_equipment_3:0 "BM 14"    
    SOV_sov_mechanized_artillery_equipment_3:0 "BM 14"    
    sov_mechanized_artillery_equipment_3_short:0 "BM 14"
    sov_mechanized_artillery_equipment_3_desc:0 "The BM-14 was a motorised multiple rocket launcher armed with 140 mm M-14 rockets, developed in 1947. Mounted on truck chassis such as the ZIS-151 or later ZIL-157, it carried up to 16 launch tubes and was intended as a postwar improvement over the wartime BM-13. It featured slightly better range, larger warheads, and more stable firing platforms. Like its predecessor, it delivered high-volume saturation fire but suffered from poor accuracy, slow reload times, and minimal crew protection. Nonetheless, it remained in service for decades and was widely exported, becoming a common artillery asset in many Soviet-aligned forces."

    sov_mechanized_aa_equipment_1:0 "72  @SOV  K GAZ MM"    
    SOV_sov_mechanized_aa_equipment_1:0 "72 K GAZ MM"    
    sov_mechanized_aa_equipment_1_short:0 "72 K GAZ MM"
    sov_mechanized_aa_equipment_1_desc:0 ""

    sov_mechanized_aa_equipment_2:0 "ZIS 43"    
    SOV_sov_mechanized_aa_equipment_2:0 "ZIS 43"    
    sov_mechanized_aa_equipment_2_short:0 "ZIS 43"
    sov_mechanized_aa_equipment_2_desc:0 ""

    sov_mechanized_aa_equipment_3:0 "BTR AA"    
    SOV_sov_mechanized_aa_equipment_3:0 "BTR AA"    
    sov_mechanized_aa_equipment_3_short:0 "BTR AA"
    sov_mechanized_aa_equipment_3_desc:0 "BTR AA"

    sov_scout_car_equipment_1:0 "1934  @SOV  Armored Car"
    SOV_sov_scout_car_equipment_1:0 "FAI"
    sov_scout_car_equipment_1_short:0 "FAI"
    sov_scout_car_equipment_1_desc:0 "The FAI was a light armored car armed with a 7.62mm DT machine gun, developed in 1933. Built on the chassis of the GAZ-A passenger car, itself a licensed Ford Model A copy, it featured a fully enclosed turret and simple riveted armor designed to protect against small arms fire and shrapnel. Intended primarily for reconnaissance, convoy escort, and internal security duties, the FAI offered good road mobility but poor off-road performance and minimal protection. Its light armament and limited durability made it unsuitable for front-line combat, but it represented an important early step in Soviet armored car development."

    sov_scout_car_equipment_2:0 "1936  @SOV  Armored Car"
    SOV_sov_scout_car_equipment_2:0 "Ba 20"
    sov_scout_car_equipment_2_short:0 "Ba 20"
    sov_scout_car_equipment_2_desc:0 "The BA-20 was a light armored car armed with a 7.62mm DT machine gun, developed in 1934. Based on the GAZ-M1 passenger car chassis, it featured a fully enclosed turret and lightly riveted armor, intended for reconnaissance, communication, and security duties. It offered good road mobility but suffered from poor off-road performance, limited armor, and light armament, making it vulnerable in combat situations. Although quickly rendered obsolete, the BA-20 saw extensive early-war use and marked a transitional step in Soviet armored car design."

    sov_scout_car_equipment_3:0 "1942  @SOV  Armored Car"
    SOV_sov_scout_car_equipment_3:0 "Ba 64"
    sov_scout_car_equipment_3_short:0 "Ba 64"
    sov_scout_car_equipment_3_desc:0 "The BA-64 was a light armored car armed with a 7.62mm DT machine gun, developed in 1941. Based on the chassis of the GAZ-64 light utility vehicle, it featured fully enclosed sloped armor and a one-man turret, offering basic protection against small arms fire and shrapnel. Designed for reconnaissance, liaison, and security tasks, it was compact, mobile, and relatively easy to produce. However, its light armor, weak armament, and cramped interior limited its combat effectiveness. Despite these drawbacks, the BA-64 served throughout the war as the Red Armys standard light armored car and was valued for its simplicity and versatility."

    sov_scout_car_equipment_4:0 "1950  @SOV  Armoured Car"
    SOV_sov_scout_car_equipment_4:0 "BTR 40"
    sov_scout_car_equipment_4_short:0 "BTR 40"
    sov_scout_car_equipment_4_desc:0 "The BTR-40 was a heavy armored car developed in 1950, based on the GAZ-63 truck chassis. It featured an open-topped armored hull for up to eight troops and was typically armed with a 7.62mm SGMB or 12.7mm DshK machine gun depending on the variant. Designed for troop transport, reconnaissance, and internal security, it offered good road mobility, basic protection against small arms fire, and ease of maintenance. However, it lacked overhead protection, had limited off-road capability, and could not operate effectively in NBC conditions. Despite its shortcomings, the BTR-40 was widely deployed and served as a foundation for later Soviet APC designs."

    sov_scout_car_equipment_5:0 "BRDM 1"
    SOV_sov_scout_car_equipment_5:0 "BRDM 1"
    sov_scout_car_equipment_5_short:0 "BRDM 1"
    sov_scout_car_equipment_5_desc:0 "BRDM 1"

    sov_armoured_car_equipment_1:0 "1934  @SOV  Armored Car"
    SOV_sov_armoured_car_equipment_1:0 "BA 6"
    sov_armoured_car_equipment_1_short:0 "BA 6"
    sov_armoured_car_equipment_1_desc:0 "The BA 6 was an armored car armed with a 45mm 20-K gun, developed in 1935. Based on a modified GAZ-AAA truck chassis, it featured a fully enclosed turret adapted from the T-26 light tank and riveted armor sufficient against small arms fire. Designed for reconnaissance and fire support roles, it offered significantly improved firepower over earlier armored cars, capable of engaging enemy light armor. However its high silhouette, limited off-road mobility, and thin armor made it vulnerable. Despite these drawbacks, the BA-6 was a notable step in Soviet armored car development and saw combat in Spain, Mongolia, and early World War II."

    sov_armoured_car_equipment_2:0 "1938  @SOV  Armored Car"
    SOV_sov_armoured_car_equipment_2:0 "BA 10"
    sov_armoured_car_equipment_2_short:0 "BA 10"
    sov_armoured_car_equipment_2_desc:0 "The BA 10 was an armored car armed with a 45mm 20-K gun, developed in 1938. Based on an improved GAZ-AAA truck chassis, it featured an improved turret, thicker riveted armor, and impoved mobility. Intended for reconnaissance and fire support, it could engage light armored vehicles and fortified positions while retaining road speed and range. It also carried auxiliary tracks to improve off-road performance. However, it remained vulnerable due to its high profile, limited armor, and poor cross-country capability. The BA 10 was the most advanced Soviet prewar armored car."

    sov_armoured_car_equipment_3:0 "BA 11"
    SOV_sov_armoured_car_equipment_3:0 "BA 11"
    sov_armoured_car_equipment_3_short:0 "BA 11"
    sov_armoured_car_equipment_3_desc:0 "Cannon-Armed Armored Car"

    sov_light_equipment_1:0 "1934  @SOV  Light Tank"
    SOV_sov_light_equipment_1:0 "T-26 (33)"
    sov_light_equipment_1_short:0 "T-26 (33)"
    sov_light_equipment_1_desc:0 "The T-26 (33) was a light tank armed with a 45mm 20-K gun, developed in 1933. As a major revision of earlier twin-turreted models, it introduced a single turret with a more effective main armament, allowing it to engage enemy armor and fortified positions. Designed for direct infantry support, it was simple, reliable, and widely produced. However, it remained lightly armored and slow, making it vulnerable on a fast-moving battlefield. Nonetheless, at the time of its introduction, it was one of the most capable light tanks in service."

    sov_light_equipment_2:0 "T-26 (38)"
    SOV_sov_light_equipment_2:0 "T-26 (38)"
    sov_light_equipment_2_short:0 "T-26 (38)"
    sov_light_equipment_2_desc:0 ""

    sov_light_equipment_3:0 "1939  @SOV  Light Tank"
    SOV_sov_light_equipment_3:0 "T-50"
    sov_light_equipment_3_short:0 "T-50"
    sov_light_equipment_3_desc:0 "The T-50 was a light tank armed with a 45mm 20-K gun, developed in 1940. Designed as a modern replacement for the aging T-26, it featured fully welded, sloped armor, a torsion bar suspension, and a commander's cupola—unusual for Soviet light tanks of the time. It offered strong protection for its class, good mobility, and a modern layout that mirrored larger medium tanks. However, it was complex and its engine proved unreliable. Proving expensive to produce, the T-50 stood out as one of the most advanced light tanks of its generation."

    sov_light_equipment_4:0 "1940  @SOV  Light Tank"
    SOV_sov_light_equipment_4:0 "T-60"
    sov_light_equipment_4_short:0 "T-60"
    sov_light_equipment_4_desc:0 "The T-60 was a light tank armed with a 20mm TNSh autocannon, developed in 1941. Intended as a simple, mass-producible replacement for the obsolete T-38 and T-40, it featured fully welded armor, a small turret, and components based on civilian trucks. Easy to manufacture while offering basic protection and mobility, it was suitable for reconnaissance and infantry support. However its light armor and weak armament limited its effectiveness against enemy tanks and fortifications. Despite this, the T-60 played a vital role in the early war years due to its availability and ease of production."

    sov_light_equipment_5:0 "1942  @SOV  Light Tank"
    SOV_sov_light_equipment_5:0 "T-70"
    sov_light_equipment_5_short:0 "T-70"
    sov_light_equipment_5_desc:0 "The T-70 was a light tank armed with a 45mm 20-K gun, developed in 1942. Intended to replace the under-armed T-60, it featured improved armor, a more powerful engine, and a new two-man turret that allowed the commander to focus solely on command duties. It offered reasonable mobility and protection for its class and was capable of engaging lightly armored targets. But it was highly vulnerable to light anti-tank weapons and quickly became obsolete as tank combat shifted toward heavier designs. Nonetheless, the T-70 served widely until 1944 and was the last light tank produced by the Soviet Union in large numbers."

    sov_light_equipment_6:0 "T-80"
    SOV_sov_light_equipment_6:0 "T-80"
    sov_light_equipment_6_short:0 "T-80"
    sov_light_equipment_6_desc:0 ""

    sov_light_equipment_7:0 "1947  @SOV  Amphibious Tank"
    SOV_sov_light_equipment_7:0 "PT-76"
    sov_light_equipment_7_short:0 "PT-76"
    sov_light_equipment_7_desc:0 "The PT-76 was an amphibious tank armed with a 76.2mm D-56T gun, developed in 1950. Designed for reconnaissance, river crossing, and support roles, it featured a fully amphibious hull, a flat boat-like shape, and dual waterjets for propulsion in water. Its light armor provided protection against small arms fire, while its low profile and good mobility made it suitable for rapid deployment and maneuver warfare. However, it was poorly protected and lightly armed compared to main battle tanks. Despite this, the PT-76 was widely used by Soviet and allied forces and remained in service for decades due to its unique amphibious capability."

    sov_light_spg_equipment_1:0 "1934  @SOV  Light SP Artillery"
    SOV_sov_light_spg_equipment_1:0 "SU-5"
    sov_light_spg_equipment_1_short:0 "SU-5"
    sov_light_spg_equipment_1_desc:0 "The SU-5 was a light self-propelled artillery armed with a 76.2mm divisional gun, developed in 1936. Based on the T-26 chassis, it was intended to provide mobile fire support for mechanized formations and featured an open-topped fighting compartment at the rear. It offered acceptable firepower and mobility for its time, but suffered from thin armor, a cramped layout, and limited ammunition capacity. Only a small number were produced before the concept was abandoned in favor of more capable designs, yet it marked an early step in Soviet efforts to integrate artillery with armored forces."

    sov_light_spg_equipment_2:0 "SU 26"
    SOV_sov_light_spg_equipment_2:0 "SU 26"
    sov_light_spg_equipment_2_short:0 "SU 26"
    sov_light_spg_equipment_2_desc:0 ""

    sov_light_spg_equipment_5:0 "1942  @SOV  Light SP Artillery"
    SOV_sov_light_spg_equipment_5:0 "SU-76"
    sov_light_spg_equipment_5_short:0 "SU-76"
    sov_light_spg_equipment_5_desc:0 "The SU-76 was a light tank destroyer armed with a 76.2mm ZiS-3 gun, developed in 1942. Based on a lengthened T-70 chassis, it was intended to provide mobile infantry support and anti-tank capability and featured an open-topped casemate for ease of production and crew operation. It was cheap, easy to build, and highly versatile, serving in roles from direct fire support to tank destroyer. While its armor was thin and the open compartment left the crew vulnerable, the SU-76 proved reliable and widely effective, becoming one of the most produced Soviet armored vehicles of the war."

    sov_light_aa_equipment_4:0 "1942  @SOV  SPAA"
    SOV_sov_light_aa_equipment_4:0 "T-60-Z"
    sov_light_aa_equipment_4_short:0 "T-60-Z"
    sov_light_aa_equipment_4_desc:0 "The T-60-Z was a light self-propelled anti-aircraft vehicle armed with dual 12.7mm DShK machine guns, developed in 1942. Based on the T-60 light tank chassis, it featured an open-topped turret and was intended to provide mobile AA support for mechanized units. While fast and compact, it suffered from a cramped layout, limited firepower, and poor crew protection. Only a few prototypes were built before the concept was abandoned. It marked one of the earliest Soviet attempts to create a tracked, armored anti-air platform."

    sov_light_aa_equipment_5:0 "1943  @SOV  SPAA"
    SOV_sov_light_aa_equipment_5:0 "ZUT-37"
    sov_light_aa_equipment_5_short:0 "ZUT-37"
    sov_light_aa_equipment_5_desc:0 "The ZUT-37 was a light self-propelled anti-aircraft vehicle armed with a 37mm Sh-37 autocannon, developed in 1942. Based on the T‑70 light tank chassis, it featured an open-topped turret fitted with the high-velocity gun designed for both ground and air targets. Intended to escort armored formations and provide mobile air defense, it offered good road mobility and firepower for its size. However, the exposed gun mount, thin armor, cramped layout, and slow turret traverse significantly limited its combat effectiveness. Only a few prototypes were built before the project was canceled in favor of more effective designs."

    sov_light_aa_equipment_6:0 "1944  @SOV  SPAA"
    SOV_sov_light_aa_equipment_6:0 "ZSU-37"
    sov_light_aa_equipment_6_short:0 "ZSU-37"
    sov_light_aa_equipment_6_desc:0 "The ZSU-37 was a light self-propelled anti-aircraft vehicle armed with a 37mm 61-K autocannon, developed in 1944. Based on the SU-76M chassis, it featured an open-topped rotating turret and was designed to provide mobile air defense for mechanized units. It combined good mobility with proven armament and was easy to produce, but its single gun was of limited effectiveness against fast or high-flying aircraft. Produced in small numbers late in the war, it remained in limited use into the early postwar period."

    sov_medium_equipment:0 "Soviet Medium Tank"
    sov_medium_equipment_short:0 "Soviet Medium Tank"
    sov_medium_equipment_desc:0 "Soviet Medium Tank"
    sov_medium_spg_equipment:0 "Soviet Medium SPG"
    sov_medium_spg_equipment_short:0 "Soviet Medium SPG"
    sov_medium_spg_equipment_desc:0 "Soviet Medium SPG"
    sov_medium_td_equipment:0 "Soviet Medium TD"
    sov_medium_td_equipment_short:0 "Soviet Medium TD"
    sov_medium_td_equipment_desc:0 "Soviet Medium TD"
    sov_medium_aa_equipment:0 "Soviet Medium AA"
    sov_medium_aa_equipment_short:0 "Soviet SPAA"
    sov_medium_aa_equipment_desc:0 "Soviet SPAA"

    sov_medium_equipment_1:0 "1934  @SOV  Heavy Medium Tank"
    SOV_sov_medium_equipment_1:0 "T-28"
    sov_medium_equipment_1_short:0 "T-28"
    sov_medium_equipment_1_desc:0 "."

    sov_medium_equipment_2:0 "1936  @SOV  Medium Tank"
    SOV_sov_medium_equipment_2:0 "BT-7"
    sov_medium_equipment_2_short:0 "BT-7"
    sov_medium_equipment_2_desc:0 "The BT-7 was a light tank armed with a 45mm 20-K gun, developed in 1935. As the final and most advanced model of the BT series, it featured improved armor, a new welded hull, and a more powerful engine while retaining the high-speed Christie suspension and convertible drive. Intended for fast maneuver warfare, it offered excellent mobility and decent firepower for its time. Its drawbacks included thin armor, poor reliability in rough terrain, and vulnerability to anti-tank weapons, limiting its survivability in prolonged combat."
    
    sov_medium_equipment_0:0 "1932  @SOV  Medium Tank"
    SOV_sov_medium_equipment_0:0 "BT-5"
    sov_medium_equipment_0_short:0 "BT-5"
    sov_medium_equipment_0_desc:0 "The BT-5 was a medium tank armed with a 45mm 20-K gun, developed in 1933. As an evolution of the earlier BT-2, it retained the high-speed Christie suspension and convertible drive system but introduced a new, larger turret with a proper cannon, significantly improving its firepower. Designed for fast breakthrough operations and deep raids, it combined excellent speed and mobility with good armament for its class. However, it was thinly armored, mechanically unreliable over long distances, and vulnerable to even light anti-tank weapons."

    sov_medium_equipment_3:0 "1941  @SOV  Medium Tank"
    SOV_sov_medium_equipment_3:0 "T-34-76 "
    sov_medium_equipment_3_short:0 "T-34-76 "
    sov_medium_equipment_3_desc:0 "The T-34-76 was a medium tank armed with a 76.2mm L-11 gun, developed in 1939. Designed to replace the BT series, it introduced revolutionary features such as sloped armor, a diesel engine, and wide tracks for excellent mobility and protection. Early models featured a two-man turret and relatively weak main gun, which limited crew efficiency and combat performance. Nevertheless, it marked a major leap in tank design, offering a balance of speed, firepower, and survivability unmatched at the time of its introduction."

    sov_medium_equipment_4:0 "1942  @SOV  Medium Tank"
    SOV_sov_medium_equipment_4:0 "T-34M"
    sov_medium_equipment_4_short:0 "T-34M"
    sov_medium_equipment_4_desc:0 "The T-34M was a medium tank armed with a 76.2mm F-34 gun, developed in 1941. Intended as an improved version of the original T-34, it featured a new torsion bar suspension, a three-man turret with commanders cupola, improved armor layout, and more efficient crew ergonomics. Designed to address the weaknesses of the early T-34 models, particularly in crew coordination and mechanical reliability, it promised better combat performance overall. However, due to the German invasion in 1941, the project was canceled before production began, with focus shifting to mass-producing the T-34-76 (F-34) instead."

    sov_medium_equipment_5:0 "1942  @SOV  Medium Tank"
    SOV_sov_medium_equipment_5:0 "T-34-76 (F-34)"
    sov_medium_equipment_5_short:0 "T-34-76 (F-34)"
    sov_medium_equipment_5_desc:0 "The T-34-76 F-34 was a medium tank armed with a 76.2mm F-34 gun, introduced in 1941. This version replaced the earlier L-11 and short-barreled models with the far more effective F-34, offering significantly improved penetration and firepower. Retaining the sloped armor, diesel engine, and wide tracks of its predecessors, it remained fast, well-protected, and highly mobile. Despite its powerful gun and strong design, it still suffered from a cramped two-man turret and limited visibility, placing a heavy workload on the commander."

    sov_medium_equipment_6:0 "1944  @SOV  Medium Tank"
    SOV_sov_medium_equipment_6:0 "T-34-85"
    sov_medium_equipment_6_short:0 "T-34-85"
    sov_medium_equipment_6_desc:0 "The T-34-85 was a medium tank armed with an 85mm ZiS-S-53 gun, developed in 1943. Introduced to counter heavier German tanks, it featured a completely new, larger three-man turret with improved optics and a radio for the commander, as well as thicker armor and a much more powerful main gun. These improvements significantly enhanced both firepower and crew efficiency while retaining the originals mobility and ease of production. Though no longer invulnerable on the battlefield, it was a well-balanced and highly effective design for late-war conditions."

    sov_assault_artillery_equipment_2_5:0 "1941  @SOV  Assault Gun"
    SOV_sov_assault_artillery_equipment_2_5:0 "OT-34"
    sov_assault_artillery_equipment_2_5_short:0 "OT-34"
    sov_assault_artillery_equipment_2_5_desc:0 "The OT-34 was a medium flamethrower assault gun armed with an ATO-41 or ATO-42 flame projector, developed in 1942. Based on the chassis of the T-34-76 and later the T-34-85, it replaced the hull-mounted machine gun with a flamethrower while retaining the standard turret gun. Intended for close support and bunker-clearing roles, it maintained the mobility, armor, and firepower of the base model while adding a powerful but short-ranged weapon. Its use was limited by the short flame range, the danger of carrying flammable fuel, and its vulnerability in close combat."

    sov_assault_artillery_equipment_3:0 "1943  @SOV  Heavy Assault Gun"
    SOV_sov_assault_artillery_equipment_3:0 "SU-122"
    sov_assault_artillery_equipment_3_short:0 "SU-122"
    sov_assault_artillery_equipment_3_desc:0 "The SU-122 was a heavy assault gun armed with a 122mm M-30S howitzer, developed in 1942. Based on the T-34 chassis, it featured a fixed superstructure housing the large gun, intended to provide direct fire support against enemy fortifications and infantry. The powerful howitzer was effective against soft targets and bunkers, though its low velocity limited anti-tank performance. Lacking a turret, it had reduced flexibility and crew visibility, but it was relatively well-protected, mobile, and easier to produce than turreted vehicles."
    
    sov_assault_artillery_equipment_4:0 "1943  @SOV  Assault Gun"
    SOV_sov_assault_artillery_equipment_4:0 "OT-34 85"
    sov_assault_artillery_equipment_4_short:0 "OT-34 85"
    sov_assault_artillery_equipment_4_desc:0 "The OT-34-85 was a medium flamethrower assault gun armed with an ATO-42 flame projector, developed in 1944. Based on the T-34-85, it retained the standard turret and 85mm gun while replacing the hull machine gun with a flamethrower for close support roles. This configuration allowed it to engage both fortified positions and armored targets, combining heavy firepower with short-range incendiary capability. The added flamethrower fuel increased risk to the crew, but overall effectiveness remained high due to improved armor, firepower, and tactical flexibility."

    sov_medium_td_equipment_1:0 "ZIS 30"
    SOV_sov_medium_td_equipment_1:0 "ZIS 30"
    sov_medium_td_equipment_1_short:0 "ZIS 30"
    sov_medium_td_equipment_1_desc:0 ""

    sov_medium_td_equipment_3:0 "1943  @SOV  Medium TD"
    SOV_sov_medium_td_equipment_3:0 "SU-85"
    sov_medium_td_equipment_3_short:0 "SU-85"
    sov_medium_td_equipment_3_desc:0 "The SU-85 was a medium tank destroyer armed with an 85mm D-5S gun, developed in 1943. Based on the T-34 chassis, it featured a fixed superstructure mounting a powerful high-velocity gun capable of defeating the armor of contemporary German tanks. Designed to counter the appearance of the Panther and Tiger, it lacked a turret but offered improved firepower over the standard T-34 and was quicker to produce than a full tank. It had good mobility and protection but suffered from limited crew visibility and restricted traverse, requiring careful positioning in combat."

    sov_medium_td_equipment_4:0 "1944  @SOV  Medium TD"
    SOV_sov_medium_td_equipment_4:0 "SU-100"
    sov_medium_td_equipment_4_short:0 "SU-100"
    sov_medium_td_equipment_4_desc:0 "The SU-100 was a medium tank destroyer armed with a 100mm D-10S gun, developed in 1944. Built on the T-34 chassis, it replaced the earlier SU-85 and featured a more powerful gun capable of destroying the heaviest German tanks at long range. The fixed superstructure offered strong frontal armor, while the vehicle retained good mobility and ease of production. Though lacking a turret and with limited situational awareness, its excellent firepower and protection made it one of the most effective Soviet tank destroyers of the war."

    sov_medium_aa_equipment_4:0 "ZSU 37"
    SOV_sov_medium_aa_equipment_4:0 "ZSU 37"
    sov_medium_aa_equipment_4_short:0 "ZSU 37"
    sov_medium_aa_equipment_4_desc:0 ""

    sov_medium_equipment_7:0 "1944  @SOV  Medium Tank"
    SOV_sov_medium_equipment_7:0 "T-44"
    sov_medium_equipment_7_short:0 "T-44"
    sov_medium_equipment_7_desc:0 "The T-44 was a medium tank armed with an 85mm ZiS-S-53 gun, developed in 1944. Designed to replace the T-34, it introduced a new hull with transverse engine placement, a lower profile, improved armor layout, and torsion bar suspension. While offering better crew protection, reduced silhouette, and superior mobility, its firepower remained similar to the T-34-85. The tank also featured improved ergonomics and a more balanced weight distribution, laying the groundwork for the next generation of Soviet medium tanks."

    sov_medium_td_equipment_5:0 "SU 101"
    SOV_sov_medium_td_equipment_5:0 "SU 101"
    sov_medium_td_equipment_5_short:0 "SU 101"
    sov_medium_td_equipment_5_desc:0 "Tank Destroyer on a T-44 chassis"

    sov_medium_aa_equipment_5:0 "ZSU 57 2"
    SOV_sov_medium_aa_equipment_5:0 "ZSU 57 2"
    sov_medium_aa_equipment_5_short:0 "ZSU 57 2"
    sov_medium_aa_equipment_5_desc:0 ""

    sov_medium_equipment_8:0 "T-44 100"
    SOV_sov_medium_equipment_8:0 "T-44 100"
    sov_medium_equipment_8_short:0 "T 44 100"
    sov_medium_equipment_8_desc:0 ""

    sov_medium_equipment_9:0 "KV-13"
    SOV_sov_medium_equipment_9:0 "KV-13"
    sov_medium_equipment_9_short:0 "KV-13"
    sov_medium_equipment_9_desc:0 ""

    sov_medium_spg_equipment_2:0 "1936  @SOV  Assault Gun"
    SOV_sov_medium_spg_equipment_2:0 "BT-7 Artillery Support Tank"
    sov_medium_spg_equipment_2_short:0 "BT-7A"
    sov_medium_spg_equipment_2_desc:0 "The BT-7A was a medium assault gun armed with a 76.2mm KT-26 howitzer, developed in 1935. Based on the BT-7 chassis, it featured a modified turret to accommodate the larger gun for infantry support and destruction of field fortifications. It retained the high speed and limited armor of the BT series, but the increased firepower came at the cost of reduced ammunition capacity and a slower rate of fire. Its primary role was to supplement standard BT units with heavier fire support during rapid advances."
    
    sov_medium_spg_equipment_5:0 "SU 102"
    SOV_sov_medium_spg_equipment_5:0 "SU 102"
    sov_medium_spg_equipment_5_short:0 "SU 102"
    sov_medium_spg_equipment_5_desc:0 "Assault Gun on a T-44 chassis"
    
    sov_medium_spg_equipment_9:0 "S 51"
    SOV_sov_medium_spg_equipment_9:0 "S 51"
    sov_medium_spg_equipment_9_short:0 "S 51"
    sov_medium_spg_equipment_9_desc:0 ""

    sov_modern_equipment:0 "Soviet Modern Tank"
    sov_modern_equipment_short:0 "Soviet Modern Tank"
    sov_modern_equipment_desc:0 "Soviet Modern Tank"
    sov_modern_td_equipment:0 "Soviet Modern TD"
    sov_modern_td_equipment_short:0 "Soviet Modern TD"
    sov_modern_td_equipment_desc:0 "Soviet Modern TD"

    sov_modern_equipment_1:0 "1947  @SOV  Medium Tank"
    SOV_sov_modern_equipment_1:0 "T-54-1"
    sov_modern_equipment_1_short:0 "T-54-1"
    sov_modern_equipment_1_desc:0 "The T-54-1 was a medium tank armed with a 100mm D-10T gun, first produced in 1947. As the first production model of the T-54 series, it introduced a new hull design with heavy frontal armor and retained the T-44s compact layout and low silhouette. The powerful gun offered a major firepower upgrade over the T-34-85, while mobility and protection were also significantly improved. However, the early turret design was poorly shaped and had shot traps, leading to production issues and limited service."

    sov_modern_td_equipment_1:0 "1950  @SOV  Medium Tank Destroyer"
    SOV_sov_modern_td_equipment_1:0 "SU 122 54"
    sov_modern_td_equipment_1_short:0 "SU-122-54"
    sov_modern_td_equipment_1_desc:0 "The SU-122-54 was a medium tank destroyer armed with a 122mm D-49 gun, developed in 1949. Based on the T-54 chassis, it featured a low-profile fixed superstructure and thick frontal armor, combining excellent mobility with formidable long-range firepower. Designed to replace earlier wartime assault guns, it could effectively engage fortified positions and heavy armor. Its lack of a turret limited flexibility, but its strong protection and high-velocity gun made it a serious threat on the battlefield."

    sov_modern_aa_equipment_1:0 "1947  @SOV  SPAA"
    SOV_sov_modern_aa_equipment_1:0 "ZSU 57 2"
    sov_modern_aa_equipment_1_short:0 "ZSU-57-2"
    sov_modern_aa_equipment_1_desc:0 "The ZSU-57-2 was a self-propelled anti-aircraft gun armed with twin 57mm S-68 autocannons, developed in 1950. Based on a modified T-54 chassis, it featured an open-top rotating turret housing the powerful twin guns intended to counter low-flying aircraft and light ground targets. It offered high mobility, strong firepower, and good cross-country performance, but lacked radar targeting, crew protection, and sufficient fire control systems for fast jet-era combat, limiting its effectiveness."

    sov_modern_equipment_2:0 "1950  @SOV  Medium Tank"
    SOV_sov_modern_equipment_2:0 "T-54-2"
    sov_modern_equipment_2_short:0 "T-54-2"
    sov_modern_equipment_2_desc:0 "The T-54-2 was a medium tank armed with a 100mm D-10T gun, developed in 1949. It was an improved version of the initial T-54-1, introducing a new turret with a more rounded shape to eliminate shot traps, as well as refinements to the hull and running gear for better reliability. Armor, firepower, and mobility remained strong, and the revised design addressed many of the issues of its predecessor. The T-54-2 marked the transition toward the definitive layout of the T-54 series."

    sov_modern_spg_equipment_2:0 "SO 152"
    SOV_sov_modern_spg_equipment_2:0 "SO 152"
    sov_modern_spg_equipment_2_short:0 "SO 152"
    sov_modern_spg_equipment_2_desc:0 ""

    sov_modern_equipment_3:0 "T-54 2"
    SOV_sov_modern_equipment_3:0 "T-54 2"
    sov_modern_equipment_3_short:0 "T-54 2"
    sov_modern_equipment_3_desc:0 "Major modernization of the T-54 with night-vision optics. Designed as a competitive 50's Soviet MBT."

    sov_heavy_equipment:0 "Soviet Heavy Tank"
    sov_heavy_equipment_short:0 "Soviet Heavy Tank"
    sov_heavy_equipment_desc:0 "Soviet Heavy Tank"
    sov_heavy_spg_equipment:0 "Soviet Heavy SPG"
    sov_heavy_spg_equipment_short:0 "Soviet Heavy SPG"
    sov_heavy_spg_equipment_desc:0 "Soviet Heavy SPG"
    sov_heavy_td_equipment:0 "Soviet Heavy TD"
    sov_heavy_td_equipment_short:0 "Soviet Heavy TD"
    sov_heavy_td_equipment_desc:0 "Soviet Heavy TD"

    sov_super_heavy_equipment_1:0 "1934  @SOV  Super Heavy Tank"
    SOV_sov_super_heavy_equipment_1:0 "T-35"
    sov_super_heavy_equipment_1_short:0 "T-35"
    sov_super_heavy_equipment_1_desc:0 "The T-35 was a super-heavy tank armed with a 76.2mm KT-28 gun and two 45mm 20K guns, developed in 1932. Featuring five turrets and a crew of up to 11, it was designed as a breakthrough tank to lead assaults against fortified positions. Though imposing in size and firepower, it suffered from thin armor, poor mobility, mechanical unreliability, and extreme difficulty in coordinating its multiple turrets effectively, which severely limited its combat effectiveness."

    sov_heavy_equipment_1:0 "1934  @SOV  Heavy  Tank"
    SOV_sov_heavy_equipment_1:0 "T-28"
    sov_heavy_equipment_1_short:0 "T-28"
    sov_heavy_equipment_1_desc:0 "The T-28 was a heavy tank armed with a 76.2mm KT-28 gun, developed in 1931. Designed as a multi-turreted breakthrough tank, it featured one main turret and two smaller machine gun turrets and was intended to support infantry attacks against fortified positions. It introduced innovations such as radio equipment and a three-man turret, unusual for its time. While offering good firepower and crew ergonomics for the early 1930s, it suffered from mechanical unreliability, thin armor, and significant coordination issues between the turrets, which limited combat efficiency and crew effectiveness."

    sov_heavy_equipment_2:0 "1940  @SOV  Heavy Tank"
    SOV_sov_heavy_equipment_2:0 "KV-1"
    sov_heavy_equipment_2_short:0 "KV-1"
    sov_heavy_equipment_2_desc:0 "The KV-1 was a heavy tank armed with a 76.2mm F-32 gun, developed in 1939. Designed to break through fortified lines, it featured thick armor that rendered most contemporary anti-tank weapons ineffective early in the war. Its heavy protection and decent firepower gave it a strong battlefield presence, but it was hampered by low speed, poor visibility and heavy weight which also strained its engine and transmissiona, causing frequent mechanical issues that complicated operations and maintenance."

    sov_heavy_equipment_3:0 "KV-1 76 (41)"
    SOV_sov_heavy_equipment_3:0 "KV-1 76 (41)"
    sov_heavy_equipment_3_short:0 "KV-1 76 (41)"
    sov_heavy_equipment_3_desc:0 ""

    sov_heavy_equipment_4:0 "1941  @SOV  Heavy Tank"
    SOV_sov_heavy_equipment_4:0 "KV-1S"
    sov_heavy_equipment_4_short:0 "KV-1S"
    sov_heavy_equipment_4_desc:0 "The KV-1S was a heavy tank armed with a 76.2mm ZiS-5 gun, developed in 1942. It was a lighter, faster, and more reliable version of the original KV-1, created in response to growing concerns over its sluggish mobility and mechanical issues. While overall armor thickness was reduced, a redesigned layout actually improved frontal protection, especially on the turret. The hull and turret were reworked for better weight distribution and crew efficiency, resulting in significantly improved performance. The KV-1S restored mobility to the KV platform and remained in use until more advanced designs made it obsolete."

    sov_heavy_equipment_5:0 "KV-85"
    SOV_sov_heavy_equipment_5:0 "KV-85"
    sov_heavy_equipment_5_short:0 "KV-85"
    sov_heavy_equipment_5_desc:0 ""

    sov_heavy_equipment_6:0 "1943  @SOV  Heavy Tank"
    SOV_sov_heavy_equipment_6:0 "IS"
    sov_heavy_equipment_6_short:0 "IS"
    sov_heavy_equipment_6_desc:0 "The IS was a heavy tank armed with an 85mm D-5T gun, developed in 1943. Intended to replace the KV series, it featured improved armor layout, better mobility, and a more compact, sloped hull for enhanced protection without excessive weight. It retained good off-road capability and provided better crew ergonomics than its predecessor. The IS marked the beginning of a new generation of Soviet heavy tanks focused on both firepower and survivability."

    sov_heavy_equipment_7:0 "1943  @SOV  Heavy Tank"
    SOV_sov_heavy_equipment_7:0 "IS-2"
    sov_heavy_equipment_7_short:0 "IS-2"
    sov_heavy_equipment_7_desc:0 "The IS-2 was a heavy tank armed with a 122mm D-25T gun, developed in 1943. Designed to counter German heavy tanks and fortifications, it featured thick, well-sloped armor, a new cast turret, and a powerful gun capable of defeating any enemy tank of the time. Despite its slow rate of fire and limited ammunition capacity, it was highly effective in both breakthrough and anti-armor roles. The IS-2 combined firepower and protection in a relatively mobile package and became the backbone of Soviet heavy tank units in the final years of the war."

    sov_heavy_equipment_8:0 "1945  @SOV  Heavy Tank"
    SOV_sov_heavy_equipment_8:0 "IS-3"
    sov_heavy_equipment_8_short:0 "IS-3"
    sov_heavy_equipment_8_desc:0 "The IS-3 was a heavy tank armed with a 122mm D-25T gun, developed in 1944. It introduced a radically new design with a distinctive hemispherical cast turret and a pointed, boat-shaped hull front for greatly improved ballistic protection. Armor and internal layout were optimized without increasing weight, and mobility remained similar to its predecessor. While not seeing combat in World War II, the IS-3 represented a significant leap in survivability and shaped postwar Soviet tank design."

    sov_heavy_equipment_9:0 "1947  @SOV  Heavy Tank"
    SOV_sov_heavy_equipment_9:0 "IS-4"
    sov_heavy_equipment_9_short:0 "IS-4"
    sov_heavy_equipment_9_desc:0 ""

    sov_heavy_equipment_10:0 "1947  @SOV  Heavy Tank"
    SOV_sov_heavy_equipment_10:0 "IS-7"
    sov_heavy_equipment_10_short:0 "IS-7"
    sov_heavy_equipment_10_desc:0 "The IS-7 was a heavy tank armed with a 130mm S-70 gun, developed in 1947. It featured extremely thick armor with a sharply sloped front hull, a powerful naval-derived main gun with an autoloader, and advanced systems such as hydraulic turret traverse and infrared sights. Weighing nearly 70 tons, it combined massive firepower, excellent protection, and surprisingly high mobility thanks to a 1050 hp engine. Despite its impressive capabilities, the IS-7 was too complex and costly for mass production and remained a prototype."

    sov_heavy_equipment_11:0 "IS-4"
    SOV_sov_heavy_equipment_11:0 "IS-4"
    sov_heavy_equipment_11_short:0 "IS-4"
    sov_heavy_equipment_11_desc:0 "The final development of the "Stalin" series and direct improvement from the IS-3. Competitive in the late 40's, but slowly overshadowed by the more flexible MBTs"

    sov_heavy_equipment_12:0 "IS-8M"
    SOV_sov_heavy_equipment_12:0 "IS-8M"
    sov_heavy_equipment_12_short:0 "IS-8M"
    sov_heavy_equipment_12_desc:0 ""
    
    sov_assault_artillery_equipment_1:0 "1936  @SOV  Assault Gun"
    SOV_sov_assault_artillery_equipment_1:0 "HT-26"
    sov_assault_artillery_equipment_1_short:0 "HT-26"
    sov_assault_artillery_equipment_1_desc:0 "The HT-26 was a light flamethrower assault gun armed with a KhT-26 flamethrower, developed in 1933. Based on the twin-turreted T-26 chassis, it replaced one turret with a flamethrower installation while removing the other, resulting in a single fixed weapon mount. Intended for bunker-clearing and infantry suppression, it retained the originals mobility and armor but had limited range and firepower outside its specialized role. Vulnerable to anti-tank weapons and reliant on close engagement, it was effective only under favorable conditions."

    sov_assault_artillery_equipment_2:0 "1940  @SOV  Heavy Assault Gun"
    SOV_sov_assault_artillery_equipment_2:0 "KV-2"
    sov_assault_artillery_equipment_2_short:0 "KV-2"
    sov_assault_artillery_equipment_2_desc:0 "The KV-2 was a heavy assault gun armed with a 152mm M-10 howitzer, developed in 1940. Based on the KV-1 chassis, it featured a massive, boxy turret housing the large gun intended to destroy fortifications and bunkers. While its armor was strong and firepower devastating, the tank was extremely heavy, slow, and mechanically unreliable, with a high silhouette that made it an easy target. Its enormous turret also made rotation difficult on uneven ground, limiting its combat flexibility."
    
    sov_assault_artillery_equipment_6:0 "1943  @SOV  Heavy Assault Gun"
    SOV_sov_assault_artillery_equipment_6:0 "SU-152"
    sov_assault_artillery_equipment_6_short:0 "SU-152"
    sov_assault_artillery_equipment_6_desc:0 "The SU-152 was a heavy assault gun armed with a 152mm ML-20S howitzer, developed in 1943. Based on the KV-1S chassis, it was designed to provide direct fire support against fortifications and was quickly found effective against heavy German tanks as well. Its powerful gun could destroy bunkers, buildings, and even Tiger tanks with high-explosive shells, earning it the nickname "Zveroboy", Beast Slayer. Though lightly armored for its size and slow to reload, the SU-152 proved highly effective in breakthrough operations and assault roles."

    sov_assault_artillery_equipment_7:0 "1944  @SOV  Heavy Assault Gun"
    SOV_sov_assault_artillery_equipment_7:0 "ISU-152"
    sov_assault_artillery_equipment_7_short:0 "ISU-152"
    sov_assault_artillery_equipment_7_desc:0 "The ISU-152 was a heavy assault gun armed with a 152mm ML-20S howitzer, developed in 1943. Built on the IS tank chassis to replace the earlier SU-152, it offered improved armor, better mobility, and greater reliability. Designed for direct fire against fortifications and indirect fire in support roles, it also retained impressive anti-tank capability against even the heaviest German vehicles using high-explosive shells. While its low rate of fire and lack of a dedicated anti-tank round limited sustained engagement capability, the ISU-152 proved a powerful and versatile weapon and remained in service well into the postwar era."

