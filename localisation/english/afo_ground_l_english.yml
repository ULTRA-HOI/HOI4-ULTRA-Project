    eng_medium_equipment_6:0 "1943  @ENG  Medium Tank"
    ENG_eng_medium_equipment_6:0 "Cruiser Mk VII Cavalier"
    eng_medium_equipment_6_short:0 "Cavalier"
    eng_medium_equipment_6_desc:0 "The A24 Cavalier was one of several designs set out to replace the Crusader tank. It was more heavily armoured and therefore heavier, while its 410 hp Liberty engine kept it at a similar speed."

    eng_medium_equipment_7:0 "1944  @ENG  Medium Tank"
    ENG_eng_medium_equipment_7:0 "Cruiser Mk VIII Cromwell"
    eng_medium_equipment_7_short:0 "Cromwell"
    eng_medium_equipment_7_desc:0 "The A27M Cromwell IV was a successor design to the A24 Cavalier, mounting a much more powerful 600 hp Meteor engine and a larger 75mm gun."

    eng_medium_equipment_8:0 "1945  @ENG  Medium Tank"
    ENG_eng_medium_equipment_8:0 "Cruiser Mk X Comet"
    eng_medium_equipment_8_short:0 "Comet"
