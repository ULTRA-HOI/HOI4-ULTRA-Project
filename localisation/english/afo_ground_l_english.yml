    eng_support_equipment_0:0 "1938  @ENG  Medium Tank"
    ENG_eng_support_equipment_0:0 "Cruiser Mk II"
    eng_support_equipment_0_short:0 "Cruiser Mk II"
    eng_support_equipment_0_desc:0 "The A10 Cruiser Mk II was a more heavily armoured version of the A9 Cruiser Mk I. Originally intended as an infantry tank, it was deemed insuitable for the role and instead saw service as a cavalry tank."
    
    eng_support_equipment_0_5:0 "1939  @ENG Medium Tank"
    ENG_eng_support_equipment_0_5:0 "Cruiser Mk IV"
    eng_support_equipment_0_5_short:0 "Cruiser Mk IV"
    eng_support_equipment_0_5_desc:0 "The A13 Cruiser Mk IV was a successor to both the A10 Cruiser Mk II and the A13 Mk I Cruiser Mk III. With the superior armour of the former and the Christie suspension of the latter, it represented a substantial step forward in British cavalry tank design."

    eng_support_equipment_1:0 "1940  @ENG  Light Tank"
    ENG_eng_support_equipment_1:0 "Infantry Mk III Valentine"
    eng_support_equipment_1_short:0 "Valentine I"
    eng_support_equipment_1_desc:0 "The Valentine was designed as an infantry tank. It was cheaper and lighter than many of its contemporaries, maintaining similar levels of protection at the expense of armour."

    eng_support_equipment_2:0 "1943  @ENG  Light Tank"
    ENG_eng_support_equipment_2:0 "Infantry Mk III Valentine VIII"
    eng_support_equipment_2_short:0 "Valentine VIII"
    eng_support_equipment_2_desc:0 "Improvement of the previous model, featuring a better turret with the larger 6-pounder gun."

    eng_support_equipment_3:0 "1944  @ENG  Light Tank"
    ENG_eng_support_equipment_3:0 "Infantry Mk III Valentine Mk XI"
    eng_support_equipment_3_short:0 "Valentine XI"
    eng_support_equipment_3_desc:0 "Improvement of the previous model, featuring a 75mm gun."

    eng_heavy_equipment_1:0 "1936  @ENG  Light Tank"
    ENG_eng_heavy_equipment_1:0 "Infantry Mk I Matilda Mk I"
    eng_heavy_equipment_1_short:0 "Matilda I"
    eng_heavy_equipment_1_desc:0 "The A11 Matilda I was an infantry tank. Despite being slow and mounting only a machine gun, its very heavy armour makes it near invulnerable to its contemporary opposition."

    eng_heavy_equipment_2:0 "1938  @ENG  Heavy Tank"
    ENG_eng_heavy_equipment_2:0 "Infantry Mk II Matilda II"
    eng_heavy_equipment_2_short:0 "Matilda II"
    eng_heavy_equipment_2_desc:0 "The A12 Matilda II was a much larger tank than its predecessor, with a larger 2-pounder gun and even heavier armour."

    eng_heavy_equipment_4:0 "1941  @ENG  Heavy Tank"
    ENG_eng_heavy_equipment_4:0 "Infantry Mk IV Churchill I"
    eng_heavy_equipment_4_short:0 "Churchill I"
    eng_heavy_equipment_4_desc:0 "The A22 Churchill was a large, slow and heavily armoured British infantry tank. Developed in haste and rushed into production, it suffered from very poor reliability."

    eng_heavy_equipment_5:0 "1942  @ENG  Heavy Tank"
    ENG_eng_heavy_equipment_5:0 "Infantry Mk IV Churchill Mk III"
    eng_heavy_equipment_5_short:0 "Churchill III"
    eng_heavy_equipment_5_desc:0 "The A22 Churchill Mk III replaced its predecessor's 2-pounder gun and hull-mounted 3 inch howitzer with a larger 6-pounder gun, and fixed many of the reliability issues."

    eng_heavy_equipment_6:0 "1944  @ENG  Heavy Tank"
