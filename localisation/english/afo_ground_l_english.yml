    sov_amphibious_tank_equipment_1:0 "1934  @SOV  Light Tank"
    SOV_sov_amphibious_tank_equipment_1:0 "T37A"
    sov_amphibious_tank_equipment_1_short:0 "T-37A"
    sov_amphibious_tank_equipment_1_desc:0 "The T-37A was a light tank armed with a 7.62mm DT machine gun, developed in 1932. Based on British Vickers designs, it was the first mass-produced amphibious tank in the world and featured a fully sealed hull with a rear-mounted propeller and trim vane for water operations. Its lightweight construction and mobility made it suitable for reconnaissance and infantry support across rivers and marshes. However, its very thin armor and minimal armament offered little protection, making it vulnerable even to small arms fire. Despite this, it was widely used in the 1930s and early war years in roles where its amphibious ability was essential."
    
    sov_amphibious_tank_equipment_2:0 "1936  @SOV  Light Tank"
    SOV_sov_amphibious_tank_equipment_2:0 "T38"
    sov_amphibious_tank_equipment_2_short:0 "T-38"
    sov_amphibious_tank_equipment_2_desc:0 "The T-38 was a light tank armed with a 7.62mm DT machine gun, developed in 1936. Intended as an improved successor to the T-37A, it featured a redesigned hull with better buoyancy, a rear-mounted engine, and a lower profile for improved concealment. While slightly more mobile and stable in water than its predecessor, it remained poorly protected and weakly armed, limiting its usefulness in combat. Its primary role remained reconnaissance and infantry support in riverine environments, but by the outbreak of war, it was already largely obsolete."
    
    sov_amphibious_tank_equipment_3:0 "1940  @SOV  Light Tank"
    SOV_sov_amphibious_tank_equipment_3:0 "T40"
    sov_amphibious_tank_equipment_3_short:0 "T-40"
    sov_amphibious_tank_equipment_3_desc:0 "The T-40 was a light tank armed with a 12.7mm DShK heavy machine gun, developed in 1940. Designed to replace the outdated T-37 and T-38, it featured a completely new hull with improved armor, a better suspension, and a more effective armament capable of engaging lightly armored targets. Retaining full amphibious capability with a rear-mounted propeller and trim vane, it offered better performance both on land and in water. However, its light protection and limited production meant it saw only limited service before being replaced by simpler and cheaper alternatives."

