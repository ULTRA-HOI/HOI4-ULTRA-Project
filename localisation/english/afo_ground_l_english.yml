    eng_medium_td_equipment_9:0 "1944  @ENG  Medium TD"
    ENG_eng_medium_td_equipment_9:0 "Sherman Mk VC Firefly"
    eng_medium_td_equipment_9_short:0 "Sherman Firefly"
    eng_medium_td_equipment_9_desc:0 "The Sherman Mk VC, nicknamed the Firefly thanks to the bright muzzle flash of the main gun, was a variant of the Sherman mounting the British 17-pounder gun. It was designed as a stopgap to counter new German heavily armoured tanks like the Tiger and the Panther until future British vehicles came into service."

