    eng_heavy_equipment_6_short:0 "Churchill VII"
    eng_heavy_equipment_6_desc:0 "The A22F Churchill Mk VII was a substantial redesign, featuring a wider hull, much more armour, and a larger 75mm gun."

    eng_heavy_equipment_8:0 "1945  @ENG  Heavy Tank"
    ENG_eng_heavy_equipment_8:0 "Infantry Black Prince"
    eng_heavy_equipment_8_short:0 "Black Prince"
    eng_heavy_equipment_8_desc:0 "The A43 Black Prince was the last infantry tank design ordered by the British army. It had much thicker armour than its predecessor, and carried the more powerful 17-pounder gun."

