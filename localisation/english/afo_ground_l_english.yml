    usa_medium_equipment_1:0 "1939  @USA  Medium Tank"
    USA_usa_medium_equipment_1:0 "M2 Medium Tank"
    usa_medium_equipment_1_short:0 "M2 Medium Tank"
    usa_medium_equipment_1_desc:0 "First US-designed medium tank, with performance as one might expect such a tank to have... However, cult of the machine gun probably did it more good than bad."

    usa_medium_equipment_2:0 "1941  @USA  Medium Tank"
    USA_usa_medium_equipment_2:0 "M3 Lee"
    usa_medium_equipment_2_short:0 "M3 Lee"
    usa_medium_equipment_2_desc:0 "A stopgap measure until invention of a proper large turret design which can house the 75mm M3 gun. Nonetheless, it is a major step towards the future US warhorse: M4 Sherman."

    usa_medium_equipment_3:0 "1942  @USA  Medium Tank"
    USA_usa_medium_equipment_3:0 "M4 Sherman"
    usa_medium_equipment_3_short:0 "M4 Sherman"
    usa_medium_equipment_3_desc:0 "Balanced medium tank designed to be mass produced. Ever reliable, whether used on the fields of Flanders, sand dunes of Libya; hills of Italy, marshlands of the Baltics, tundras of Russia, or jungles of Burma"

    usa_medium_equipment_4:0 "1943  @USA  Medium Tank"
    USA_usa_medium_equipment_4:0 "M4A3 Sherman"
    usa_medium_equipment_4_short:0 "M4A3 Sherman"
    usa_medium_equipment_4_desc:0 "Replacing the engine and utilizing a welded rather than cast hull, the M4A3 Sherman was the most produced and most flexible variant of the Sherman, being converted into a number of different variants."

    usa_medium_equipment_5:0 "1944  @USA  Medium Tank"
    USA_usa_medium_equipment_5:0 "M4A3 (76) Sherman"
    usa_medium_equipment_5_short:0 "M4A3 (76) Sherman"
    usa_medium_equipment_5_desc:0 "Pinnacle of the M4 Sherman design, with much improved anti-tank capability due to the 76mm M1 gun, and improved turret. Called the "Easy Eight" (coming from the HVSS suspension designation - E8) by its crews, due to being a well-rounded, easy to maintain vehicle ."

    usa_medium_equipment_6:0 "1945  @USA  Medium Tank"
    USA_usa_medium_equipment_6:0 "M26 Pershing"
    usa_medium_equipment_6_short:0 "M26 Pershing"
    usa_medium_equipment_6_desc:0 "New US Medium Tank designed to be able to face heavier German designs."

