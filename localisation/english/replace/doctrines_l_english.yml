l_english:
 GRAND_DOCTRINE_MOBILE_WARFARE: "War of Movement"
 GRAND_DOCTRINE_MOBILE_WARFARE_DESC: "Hit them where they don't expect - War of Movement seeks to break the trench deadlock of the First World War via aggressive maneuvers to pre-empt and disrupt the enemy."
 GRAND_DOCTRINE_SUPERIOR_FIREPOWER: "Superior Firepower"
 GRAND_DOCTRINE_SUPERIOR_FIREPOWER_DESC: "Send shells, not men - Superior Firepower emphasizes employing crushing masses of fire to pave the way for maneuver units to advance and capture territory."
 GRAND_DOCTRINE_GRAND_BATTLEPLAN: "Asymmetric Warfare"
 GRAND_DOCTRINE_GRAND_BATTLEPLAN_DESC: "The deadliest weapons in the world are useless without the men who wield them - Asymmetric Warfare is characterized by using clever tactics and extensive planning to assure victory."
 GRAND_DOCTRINE_MASS_ASSAULT: "Mass Assault"
 GRAND_DOCTRINE_MASS_ASSAULT_DESC: "Our willingness to sacrifice guarantees our victory - Mass Assault focuses on concentrating numerical superiority to force a breakthrough at the chosen time and place."
