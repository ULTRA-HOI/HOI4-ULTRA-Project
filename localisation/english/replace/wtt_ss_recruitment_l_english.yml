l_english:
 ss_recruitment_event.germany.a:0 "German volunteers sign up by their thousands."
 ss_recruitment_event.germany.b:0 ""
 ss_recruitment_event.denmark.a:0 "A decent number of Scandinavians, Dutch and Belgians have volunteered."
 ss_recruitment_event.norway.c:0 "Only small number of Norwegians has volunteered."
 ss_recruitment_event.netherlands.b:0 "A large number of Dutch NSB Nazis has volunteered."
 ss_recruitment_event.belgium.a:0 "A large number of Flemish & Belgian collaborators has volunteered."
 ss_recruitment_event.france.a:0 "A significant number of French collaborators has volunteered."
 ss_recruitment_event.estonia.a:0 "A significant number of Estonian nationalists has volunteered."
 ss_recruitment_event.latvia.a:0 "A large number of Latvian nationalists has volunteered."
 ss_recruitment_event.lithuania.a:0 "Only a small number of Lithuanians has volunteered."
 SS_recruitment_big_three:0 "Permit SS recruitment in Germany"
 ss_recruitment_event.9.t:0 "Recruitment Campaign in Germany"
 ss_recruitment_event.9.desc:0 "In this titanic struggle of national survival, we must use every asset and every advantage. The SS believes that there are many in Germany who would gladly pick up arms and fight by our side against the threat of global bolshevism.\n\nWhile the Wehrmacht agrees in principle that some recruitment of suitable volunteers could be useful, the Generals in the OKW very strongly believe that any foreign volunteers should be under military - not SS - command."
 GER_division_big_three_mech_tt:0 "4 elite §Ymechanized SS-Divisions (LSAH, Das Reich, Totenkopf & Polizei)§! will appear without equipment but full manpower strength."
 GER_division_big_three_mot_tt:0 "4 elite §Ymotorized SS-Divisions (LSAH, Das Reich, Totenkopf & Polizei)§! will appear without equipment but full manpower strength."
 GER_division_big_three_armored_tt:0 "4 elite §Yarmored SS-Panzerdivisions (LSAH, Das Reich, Totenkopf & Polizei)§! will appear without equipment but full manpower strength."

 SS_recruitment_nord:0 "Recruit SS Garrisons in Norway"
 ss_recruitment_event.30.t:0 "Recruit Division Nord"
 ss_recruitment_event.30.desc:0 "We should make use of the arctic climate experience of our SS garrison forces in Norway and turn them into a combat division to serve in the arctic theater."
 ss_recruitment_event.30.a:0 "Recruit Division Nord"
 GER_division_nord:0 "One §YMotorisierte SS-Division 'Nord'§! will appear without equipment but full manpower strength."

 SS_recruitment_florian_geyer:0 "Recruit a Volksdeutsche SS Cavalry Division"
 ss_recruitment_event.31.t:0 "Recruit Division Florian Geyer"
 ss_recruitment_event.31.desc:0 "The SS has been fielding cavalry units for a long time now. We should form a cavalry division from these with volunteers from German minorities in other countries allied to us or under our control to serve on the Eastern Front."
 ss_recruitment_event.31.a:0 "Recruit Division Florian Geyer"
 GER_division_florian_geyer:0 "One weak §Y SS-Kavallerie-Division 'Florian Geyer'§! will appear without equipment but full manpower strength."

 SS_recruitment_hohenstaufen:0 "Permit additional SS Recruitment in Germany"
 ss_recruitment_event.32.t:0 "Recruit Division Hohenstaufen"
 ss_recruitment_event.32.desc:0 "With the war in the East turning into a desperate struggle of attrition, we need more divisions. The Waffen-SS has many experienced veterans who can form the core of a new modern Panzergrenadier division to serve on the Eastern Front."
 ss_recruitment_event.32.a:0 "Recruit Division Hohenstaufen"
 GER_division_hohenstaufen:0 "One §YSS-Panzer-Grenadier-Division 'Hohenstaufen'§! will appear without equipment but full manpower strength."

 SS_recruitment_frundsberg:0 "Permit even more SS Recruitment in Germany"
 ss_recruitment_event.33.t:0 "Recruit Division Frundsberg"
 ss_recruitment_event.33.desc:0 "With the war in the East turning into a desperate struggle of attrition, we need more divisions. The Waffen-SS has many experienced veterans who can form the core of a new modern Panzer division to serve on the Eastern Front."
 ss_recruitment_event.33.a:0 "Recruit Division Frundsberg"
 GER_division_frundsberg:0 "One strong §YSS-Panzer-Division 'Frundsberg'§! will appear without equipment but full manpower strength."

 SS_recruitment_nordland:0 "Recruit Scandinavians & Volksdeutsche for the Waffen-SS"
 ss_recruitment_event.34.t:0 "Recruit Division Nordland"
 ss_recruitment_event.34.desc:0 "The Waffen-SS has many foreign volunteers from northern Europe spread across its forces. We should form a division from these and conscripted German minority members to serve on the Eastern Front."
 ss_recruitment_event.34.a:0 "Recruit Division Nordland"
 GER_division_nordland:0 "One §YSS-Panzergrenadier-Division 'Nordland'§! will appear without equipment but full manpower strength."

 SS_recruitment_hitlerjugend:0 "Recruit Hitlerjugend Teenagers for the Waffen-SS"
 ss_recruitment_event.35.t:0 "Recruit Division Hitlerjugend"
 ss_recruitment_event.35.desc:0 "With the war in the East turning into a desperate struggle of attrition, we need more divisions. The Waffen-SS has still some experienced veterans who can form the core of a new Panzer division to serve on the Eastern Front, but we require more men than are available to us. Recruiting the oldest and strongest of the Hitlerjugend youth organisation of the Nazi party before the Wehrmacht can do so will allow us to create a fanatical fighting force of ideologically indoctrinated teenagers."
 ss_recruitment_event.35.a:0 "Recruit Division Hitlerjugend"
 GER_division_hitlerjugend:0 "One strong §YSS-Panzer-Division 'Hitlerjugend'§! will appear without equipment but full manpower strength."

